<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kein Plan, Herr Berater</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: Kioptra-Abend: präzise, technisch, mit einem Augenzwinkern
   IDEA: ein Kontrollraum-Dashboard im Kioptra-Look: Raster, Monospace-Labels, goldene Akzente
   PICTURE: Frage groß auf dunklem Raster, vier Antwortkacheln mit Farbcode, Zeitbalken in Gold
   COLOUR and TYPE: Kioptra-Navy, Gold #e3b54a, Teal, Blau, Lavendel; IBM Plex Sans und IBM Plex Mono
   LAYOUT: TV: Kopfzeile mit Logo, Bühne, Punkteleiste; Handy: eine Spalte, große Buzzer */
:root{color-scheme:dark;--bg:#0a1422;--panel:#0f1c2e;--panel2:#14263d;--line:rgba(127,166,216,.16);--y:#e3b54a;--ink:#eef3fb;--soft:#aeb9c9;--a0:#e3b54a;--a1:#33c7a6;--a2:#5c9bd6;--a3:#8e84d8;--dark:#0a1422;--red:#e3b54a}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 'IBM Plex Sans',system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent;background-image:radial-gradient(70% 50% at 50% 0%,rgba(63,118,189,.22),transparent 70%),linear-gradient(rgba(127,166,216,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(127,166,216,.07) 1px,transparent 1px);background-size:100% 100%,48px 48px,48px 48px}
button{font:inherit}
.marq{font-family:'IBM Plex Sans',sans-serif;font-weight:700;line-height:1.05;color:var(--ink);letter-spacing:-.01em}
.marq em{font-style:normal;color:var(--y)}
.mono{font-family:'IBM Plex Mono',monospace}
.logo{display:inline-flex;align-items:center;gap:10px}
.logo svg{height:28px;width:auto;flex:none}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px 40px}
.btn{all:unset;cursor:pointer;display:block;text-align:center;background:var(--y);color:var(--dark);font:700 19px/1 'IBM Plex Sans',sans-serif;padding:18px 22px;border-radius:3px;letter-spacing:.02em}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(2px)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-size:16px}
input{width:100%;font:600 21px 'IBM Plex Sans',sans-serif;padding:15px;border-radius:3px;border:1px solid var(--y);background:var(--panel);color:var(--ink)}
input:focus-visible{outline:2px solid var(--y)}
.muted{color:var(--soft);font-size:15px}
.warn{background:rgba(227,181,74,.1);border:1px solid rgba(227,181,74,.4);border-radius:3px;padding:12px 14px;font-size:15px;margin-top:16px}
#pick .marq{font-size:clamp(38px,10vw,68px);margin:22px 0 12px;text-wrap:balance}
#pick .roles{display:grid;gap:14px;margin-top:26px}
.role{all:unset;cursor:pointer;display:block;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--y);border-radius:3px;padding:18px 20px}
.role:focus-visible{outline:2px solid var(--y);outline-offset:3px}
.role b{display:block;font:700 22px/1.2 'IBM Plex Sans',sans-serif}
.role span{color:var(--soft);font-size:15px}
.role.alt{border-left-color:var(--a1)}
#tv{display:none;min-height:100vh;flex-direction:column}
#tv.on{display:flex}
.tbar{display:flex;align-items:center;gap:16px;padding:14px 3vw;border-bottom:1px solid var(--line);background:rgba(10,20,34,.75)}
.tbar .marq{font-size:clamp(15px,1.5vw,20px);font-weight:600}
.tbar .lab{margin-left:auto;font:500 clamp(13px,1.3vw,18px) 'IBM Plex Mono',monospace;color:var(--soft)}
.ibtn{all:unset;cursor:pointer;font:500 14px 'IBM Plex Mono',monospace;padding:8px 12px;border-radius:3px;border:1px solid var(--line);color:var(--soft)}
.ibtn:focus-visible{outline:2px solid var(--y)}
.ibtn.on{border-color:var(--y);color:var(--y)}
select.ibtn{all:revert;font:500 14px 'IBM Plex Mono',monospace;padding:8px 10px;border-radius:3px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.stagebox{flex:1;display:flex;flex-direction:column;justify-content:center;padding:1.5vh 4vw 2vh;gap:2vh}
.tbarline{height:6px;background:var(--line);border-radius:0;overflow:hidden}
.tbarline i{display:block;height:100%;background:var(--y);width:100%;transition:width .25s linear}
.tbarline.low i{background:#ff7a6b}
.qtext{font:600 clamp(22px,min(3.5vw,6vh),58px)/1.18 'IBM Plex Sans',sans-serif;text-wrap:balance;max-width:30ch}
.ans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.4vw}
.an{display:flex;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:clamp(10px,min(1.4vw,2.2vh),24px);font:600 clamp(16px,min(2vw,3.5vh),32px)/1.25 'IBM Plex Sans',sans-serif;transition:opacity .3s,transform .3s,border-color .3s}
.an .l{flex:none;width:1.8em;height:1.8em;border-radius:3px;display:grid;place-items:center;color:var(--dark);font:700 1em 'IBM Plex Mono',monospace}
.an .who{display:block;font:500 clamp(12px,1vw,17px)/1.3 'IBM Plex Mono',monospace;color:var(--soft);margin-top:4px}
.an.no{opacity:.3}.an.ok{border-color:var(--y);transform:scale(1.02);background:var(--panel2);box-shadow:0 0 0 1px var(--y),0 0 40px rgba(227,181,74,.2)}
.quip{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-left:3px solid var(--y);border-radius:3px;padding:12px 20px;font:500 clamp(15px,min(1.6vw,3vh),25px)/1.35 'IBM Plex Sans',sans-serif;max-width:62ch;position:relative}
.quip::before{content:"// Kevin vom Helpdesk";display:block;font:500 13px 'IBM Plex Mono',monospace;color:var(--y);margin-bottom:3px}
.meta{display:flex;gap:18px;align-items:center;flex-wrap:wrap;font:500 clamp(13px,1.3vw,19px) 'IBM Plex Mono',monospace;color:var(--soft)}
.pill{background:transparent;color:var(--y);border:1px solid var(--y);padding:5px 12px;border-radius:2px}
.big{font-size:clamp(48px,8vw,130px)}
.dd{display:grid;grid-template-columns:1fr 1fr;gap:2vw;margin-top:1vh}
.dd .an{justify-content:center;font-size:clamp(20px,2.8vw,44px)}
.item{font:700 clamp(44px,min(9vw,16vh),140px)/1 'IBM Plex Sans',sans-serif;text-align:center;letter-spacing:-.02em;color:var(--y)}
.players{display:flex;flex-wrap:wrap;gap:10px}
.pl{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:8px 14px;font:600 clamp(15px,1.5vw,22px) 'IBM Plex Sans',sans-serif}
.sbar{display:flex;gap:10px;padding:10px 3vw 14px;overflow-x:auto;border-top:1px solid var(--line);background:rgba(10,20,34,.85)}
.sc{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:7px 14px;min-width:120px}
.sc b{display:block;font:500 13px 'IBM Plex Mono',monospace;color:var(--soft);white-space:nowrap}
.sc span{font:700 19px 'IBM Plex Sans',sans-serif;white-space:nowrap;font-variant-numeric:tabular-nums}
.sc em{font-style:normal;font:600 13px 'IBM Plex Mono',monospace;margin-left:6px}
.pos{color:var(--a1)}.neg{color:#ff7a6b}
.sc.done{border-color:var(--y)}
.podium{display:grid;gap:8px;max-width:900px}
.podium div{display:flex;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:12px 22px;font:600 clamp(19px,2.2vw,34px) 'IBM Plex Sans',sans-serif}
.podium div:first-child{background:var(--y);color:var(--dark);border-color:var(--y)}
.hint{font:500 clamp(13px,1.2vw,18px) 'IBM Plex Mono',monospace;color:var(--soft)}
#ph{display:none}#ph.on{display:block}
.pbar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:rgba(10,20,34,.9);font:600 15px 'IBM Plex Sans',sans-serif}
.pbar .logo svg{height:22px}
.pbody{padding:18px 16px 40px;max-width:560px;margin:0 auto}
.buzz{display:grid;gap:12px;margin-top:14px}
.bz{all:unset;cursor:pointer;display:flex;gap:14px;align-items:center;min-height:64px;padding:14px 16px;border-radius:3px;color:var(--dark);font:700 19px/1.25 'IBM Plex Sans',sans-serif}
.bz:active{transform:scale(.98)}
.bz:focus-visible{outline:2px solid var(--ink)}
.bz .l{font:700 22px 'IBM Plex Mono',monospace;flex:none}
.bz.dd2{min-height:120px;justify-content:center;font-size:26px}
.state{font:700 clamp(28px,8.5vw,42px)/1.12 'IBM Plex Sans',sans-serif;margin:24px 0 8px;text-wrap:balance}
.ptimer{font:600 38px 'IBM Plex Mono',monospace;color:var(--y)}
@media(max-width:700px){.ans{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.qrbox{display:flex;gap:3vw;align-items:center;flex-wrap:wrap}
.qr{background:#eef3fb;padding:14px;border-radius:3px;width:clamp(180px,22vw,300px);aspect-ratio:1}
.qr svg{width:100%;height:100%;display:block}
.code{font:600 clamp(40px,6vw,96px)/1 'IBM Plex Mono',monospace;color:var(--y);letter-spacing:.08em}
.mini{font-family:'IBM Plex Mono',monospace;color:var(--y);font-size:clamp(14px,1.4vw,20px)}
.auto{font:500 14px 'IBM Plex Mono',monospace;color:var(--soft)}
body.fxon{background:var(--bg);background-image:none}
#fx{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
#tv{position:relative;z-index:1}
body.fxon .tbar,body.fxon .sbar{background:rgba(10,20,34,.92)}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
@keyframes win{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1.02)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 1px var(--y),0 0 30px rgba(227,181,74,.25)}50%{box-shadow:0 0 0 2px var(--y),0 0 70px rgba(227,181,74,.55)}}
@keyframes tick{0%,100%{opacity:1}50%{opacity:.35}}
.stagebox.fresh .qtext,.stagebox.fresh .marq,.stagebox.fresh .item{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.stagebox.fresh .an,.stagebox.fresh .brow,.stagebox.fresh .quip,.stagebox.fresh .podium div{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.stagebox.fresh .an:nth-child(2),.stagebox.fresh .brow:nth-child(2){animation-delay:.08s}.stagebox.fresh .an:nth-child(3),.stagebox.fresh .brow:nth-child(3){animation-delay:.16s}.stagebox.fresh .an:nth-child(4),.stagebox.fresh .brow:nth-child(4){animation-delay:.24s}.stagebox.fresh .brow:nth-child(n+5){animation-delay:.32s}
.stagebox.fresh .an.ok{animation:win .7s cubic-bezier(.2,.8,.2,1) both,glow 1.6s ease-in-out .7s infinite}
.an,.brow,.quip,.pl,.sc{background-color:rgba(15,28,46,.86)}
.tbarline.low{animation:tick .5s infinite}
.stagebox.fresh .an.no{animation:none}
.stagebox{position:relative}
.rounds{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px;max-width:1300px}
.rnd{all:unset;cursor:pointer;display:grid;gap:2px;background:rgba(15,28,46,.86);border:1px solid var(--line);border-left:4px solid var(--a1);border-radius:3px;padding:12px 16px}
.rnd b{font:700 clamp(16px,1.5vw,22px) 'IBM Plex Sans',sans-serif}
.rnd span{font:500 13px 'IBM Plex Mono',monospace;color:var(--soft)}
.rnd em{font:600 13px 'IBM Plex Mono',monospace;font-style:normal;color:var(--a1)}
.rnd.done{border-left-color:var(--soft);opacity:.7}.rnd.done em{color:var(--soft)}
.rnd.on{border-color:var(--y);border-left-color:var(--y);opacity:1;box-shadow:0 0 0 1px var(--y),0 0 30px rgba(227,181,74,.2)}
.rnd:focus-visible{outline:2px solid var(--y)}
.bulbs{display:none!important;position:absolute;inset:.8vh 1.6vw;pointer-events:none;padding:9px;border-radius:14px;background:radial-gradient(circle,#ffe08a 0 3.2px,rgba(227,181,74,.25) 4.2px,transparent 5.5px) 0 0/22px 22px;-webkit-mask:linear-gradient(#000 0 0) content-box,linear-gradient(#000 0 0);-webkit-mask-composite:xor;mask-composite:exclude;animation:chase 1s steps(2) infinite;opacity:.85;filter:drop-shadow(0 0 6px rgba(227,181,74,.6))}
@keyframes chase{to{background-position:11px 11px}}
.bulbs.fast{animation-duration:.35s}
.splash{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:5}
.splash div{text-align:center;animation:splash 1.8s cubic-bezier(.2,.8,.2,1) both}
.splash b{display:block;font:700 clamp(70px,12vw,200px)/1 'IBM Plex Sans',sans-serif;color:var(--y);text-shadow:0 0 40px rgba(227,181,74,.6)}
.splash span{font:600 clamp(26px,3.5vw,56px) 'IBM Plex Mono',monospace;color:var(--ink)}
@keyframes splash{0%{opacity:0;transform:scale(2.2)}18%{opacity:1;transform:scale(1)}70%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.7)}}
.stagebox.fresh .splash~*{animation-delay:1.2s!important}
.ring{position:absolute;right:3vw;top:1.5vh;width:clamp(70px,8vw,120px);aspect-ratio:1;z-index:3}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none;stroke-width:9}
.ring .bg{stroke:rgba(127,166,216,.18)}.ring .fg{stroke:var(--y);stroke-linecap:round;transition:stroke-dashoffset .2s linear}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 clamp(26px,3vw,46px) 'IBM Plex Mono',monospace;color:var(--ink)}
.ring.low .fg{stroke:#ff7a6b}.ring.low b{color:#ff7a6b;animation:tick .5s infinite}
.board{display:grid;gap:8px;max-width:1300px}
.brow{display:grid;grid-template-columns:2.2em minmax(6em,14em) 1fr auto 7em;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:clamp(6px,1.1vh,14px) 18px;font:600 clamp(16px,min(2vw,3.4vh),32px) 'IBM Plex Sans',sans-serif}
.brow.lead{border-color:var(--y);box-shadow:0 0 30px rgba(227,181,74,.18)}
.bpos{font:700 1.1em 'IBM Plex Mono',monospace;color:var(--y)}
.bname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bname i{font-style:normal;font:600 .6em 'IBM Plex Mono',monospace;margin-left:10px}
.up{color:var(--a1)}.dn{color:#ff7a6b}
.bbar{height:.55em;background:rgba(127,166,216,.12)}
.bbar i{display:block;height:100%;background:var(--y);transition:width .8s ease}
.bval{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.bd{font:600 .7em 'IBM Plex Mono',monospace;text-align:right;white-space:nowrap;color:var(--soft)}
.sc.lead{border-color:var(--y);background:var(--panel2)}
.sc span{font-size:22px}
</style>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>

<script>
{
const QS=[
{i:'Willkommen bei Kein Plan, Herr Berater! Erste Frage, zum Aufwärmen. Bitte nicht verletzen.',q:'Laut der 90-90-Regel brauchen die ersten 90 Prozent des Codes 90 Prozent der Zeit. Und die restlichen 10 Prozent?',a:['10 Prozent der Zeit','Noch einmal 90 Prozent','Genau bis zum Go-Live','Die macht die Hypercare'],c:1,r:'Noch mal 90 Prozent. Macht zusammen 180 Prozent. Genau so steht es auch auf eurer Rechnung.'},
{i:'Stellt euch vor, euer Projekt ist verspätet. Ich weiß, schwer vorstellbar.',q:'Was passiert laut Brooks’s Law, wenn man einem verspäteten Softwareprojekt mehr Leute gibt?',a:['Es wird pünktlich','Es wird noch später','Teurer, aber pünktlich','Der Kunde merkt nichts'],c:1,r:'Noch später! Neun Leute bekommen auch kein Baby in einem Monat. Sagt Brooks, nicht ich.'},
{i:'Geschichtsstunde. Kaffee runter, Augen auf.',q:'1947 fand das Team um Grace Hopper im Harvard Mark II den ersten echten Bug. Was war es?',a:['Eine Motte','Eine Kakerlake','Eine Stubenfliege','Ein Praktikant'],c:0,r:'Eine Motte. Sie wurde ins Logbuch geklebt. Debugging im wörtlichsten Sinne.'},

  }else if(G.ph==='end'){
    const r=actV().sort((a,b)=>b.s-a.s);
    st.innerHTML=`<div class="marq big">${r.length?`Sieg für <em>${esc(r[0].n)}</em>`:'Endstand'}</div><div class="podium">${r.map((x,i)=>`<div><span>${i+1}. ${esc(x.n)}</span><span>${eur(x.s)}</span></div>`).join('')||'<div><span>Keine Handys dabei</span><span>Ehre: unbezahlbar</span></div>'}</div><div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn" id="cont" style="padding:18px 36px">Nächste Runde wählen</button><button class="btn ghost" id="again" style="padding:18px 30px">Neues Spiel, alles auf 0</button></div>`;
  }else if(G.ph==='wait'){
    st.innerHTML=`<div class="meta"><span class="pill">Kurze Pause</span><span>Kevin holt neue Fragen aus dem Backlog. Es geht automatisch weiter.</span></div>
      <div class="marq" style="font-size:clamp(30px,4vw,64px)">Zwischenstand</div>${boardHtml()}
      <div style="display:flex;gap:12px"><button class="btn" id="showEnd" style="padding:16px 30px">Endstand zeigen</button></div>`;
  }else if(G.ph==='board'){
    const r=actV().sort((a,b)=>b.s-a.s);
    st.innerHTML=`<div class="meta"><span class="pill">Kontostand nach Frage ${s.n}</span>${r.length>1?`<span>Abstand Platz 1 zu 2: ${eur(r[0].s-r[1].s)}</span>`:''}</div>
      <div class="marq" style="font-size:clamp(30px,4vw,64px)">Wer hat den höchsten <em>Tagessatz</em>?</div>${boardHtml()}
      ${G.boardLine?`<div class="quip">${esc(G.boardLine)}</div>`:''}
      <div style="display:flex;gap:14px;align-items:center"><button class="btn" id="go" style="padding:16px 30px">Weiter</button><span class="auto">${auto?'geht automatisch weiter':'Auto aus: Leertaste'}</span></div>`;
  }else if(s.k==='dde'){
    st.innerHTML=`<div class="marq big">Dis oder Dat: vorbei</div><div class="quip">${esc(curDD().end)}</div><div><button class="btn" id="go" style="display:inline-block;padding:18px 36px">Weiter</button></div>`;
  }else{
    const rev=G.ph==='rev',chose=i=>Object.entries(G.ans).filter(([k,a])=>a.a===i).map(([k])=>esc(G.scores[k]?G.scores[k].n:k)).join(', ');
    const cards=s.a.map((t,i)=>`<div class="an ${rev?(i===s.c?'ok':'no'):''}"><span class="l" style="background:${ACOL[i]}">${LET[i]}</span><span>${esc(t)}${rev?`<span class="who">${chose(i)||'&nbsp;'}</span>`:''}</span></div>`).join('');
    const cnt=Object.keys(G.ans).length,tot=livePlayers().length;
    if(s.k==='dd'){
      st.innerHTML=`<div class="meta"><span class="pill">Dis oder Dat ${s.n}/${s.of}</span><span>${esc(curDD().opts.join(' oder '))}?</span></div>
        <div class="tbarline" id="tline"><i></i></div><div class="item">${esc(s.t)}</div><div class="dd">${cards}</div>`;
    }else{
      st.innerHTML=`<div class="meta"><span class="pill">${esc(hLabel())}</span>${G.ph==='q'?`<span id="cnt">${cnt} von ${tot} haben geantwortet</span>`:''}</div>
        ${G.ph!=='read'&&!rev?'<div class="tbarline" id="tline"><i></i></div>':''}
        <div class="qtext">${esc(s.q)}</div><div class="ans">${cards}</div>
        ${G.ph==='read'?`<div class="quip">${esc(s.i)}</div>`:''}
        ${rev?`<div style="display:flex;gap:2vw;align-items:center;flex-wrap:wrap"><div class="quip" style="flex:1 1 420px">${esc(s.r)}</div><div style="flex:none;display:grid;gap:6px;justify-items:center"><button class="btn" id="go" style="padding:18px 32px">Weiter</button><span class="auto">${auto?'geht automatisch weiter':'Auto aus: Leertaste'}</span></div></div>`:''}`;
    }
  }
  const vs=$('#vsel');if(vs){vs.onchange=()=>{ls.set('kp-voice',vs.value);pickVoice()};$('#vtest').onclick=()=>say('Willkommen bei Kein Plan, Herr Berater! Ich bin Kevin vom Helpdesk, und heute geht es um euren Tagessatz.')}
  document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{G.sel=b.dataset.set;hRender()});
  const rs=$('#reset');if(rs)rs.onclick=()=>{if(G.ph==='lobby'){G.scores={};G.n=0;G.limit=20;G.restored=false;for(const x of livePlayers())G.scores[key(x.name)]={n:x.name,s:0};saveState();hRender();hPub()}};
  const sh=$('#showEnd');if(sh)sh.onclick=endShow;
  const lm=$('#lm'),lp=$('#lp');if(lm){lm.onclick=()=>{G.limit=Math.max(G.n+1,G.limit-5);saveState();hRender()};lp.onclick=()=>{G.limit+=5;saveState();hRender()}}
  const cn=$('#cont');if(cn)cn.onclick=()=>{hush();G.final=false;G.finalNext=false;G.step=-1;G.plan=[];G.ph='lobby';G.last={};G.sel=defaultSel();saveState();hRender();hPub()};
  if(['read','q','rev','bet','fin','board','intro','end'].includes(G.ph)){const bl=document.createElement('div');bl.className='bulbs'+((G.ph==='q'||G.ph==='bet')?' fast':'');st.prepend(bl)}
  if((G.ph==='q'||G.ph==='bet')){const rg=document.createElement('div');rg.className='ring';rg.id='ring';rg.innerHTML='<svg viewBox="0 0 100 100"><circle class="bg" cx="50" cy="50" r="44"/><circle class="fg" id="rgc" cx="50" cy="50" r="44" stroke-dasharray="276.5" stroke-dashoffset="0"/></svg><b id="rgn"></b>';st.append(rg);updRing()}
  if(fresh&&G.ph==='read'&&s&&s.k==='q'){const sp=document.createElement('div');sp.className='splash';sp.innerHTML=s.fin?'<div><b>FINALE</b><span>Alles oder nichts</span></div>':`<div><b>Frage ${s.n}</b><span>${eur(s.val)}</span></div>`;st.append(sp);setTimeout(()=>sp.remove(),1900);beep(330,.1);setTimeout(()=>beep(495,.18),140)}
  st.classList.toggle('fresh',fresh);
  const go=$('#go');if(go)go.onclick=()=>{const c=cur();if(G.ph==='rev'&&c&&c.fin)endShow();else if(G.ph==='rev'&&c&&c.k==='q')showBoard(c);else next()};const ag=$('#again');if(ag)ag.onclick=()=>{hush();hostInit(true)};
  hScore();
}
function hScore(){
  if(!G)return;const r=actE().sort((a,b)=>b[1].s-a[1].s);
  $('#sbar').style.display=(G.ph==='board'||G.ph==='wait')?'none':'';$('#sbar').innerHTML=r.map(([k,x],i)=>{const d=G.last[k];return `<div class="sc ${G.ph==='q'&&G.ans[k]?'done':''}${i===0?' lead':''}" data-kick="${esc(k)}" title="Doppelklick: aus dem Spiel nehmen"><b>${i+1}. ${esc(x.n)}</b><span>${eur(x.s)}</span>${G.ph==='rev'&&d!=null?`<em class="${d>=0?'pos':'neg'}">${d>=0?'+':''}${eur(d)}</em>`:''}</div>`}).join('')||'<span class="hint">Punktestand erscheint, sobald Handys verbunden sind.</span>';
  $('#sbar').querySelectorAll('[data-kick]').forEach(el=>el.ondblclick=()=>{G.kick=G.kick||{};G.kick[el.dataset.kick]=true;hScore();hPub()});
  const m=$('#cnt');if(m)m.textContent=`${Object.keys(G.ans).length} von ${livePlayers().length} haben geantwortet`;
}
document.addEventListener('keydown',e=>{if(mode!=='host')return;if(e.key==='p'||e.key==='P'){$('#pause').click();return}if(e.key==='f'||e.key==='F'){$('#finb').click();return}if(e.key==='e'||e.key==='E'){$('#fxb').click();return}if(e.key==='Enter'||e.key===' '){const b=$('#go')||$('#again');if(b){e.preventDefault();b.click()}}});

/* ========== SPIELER ========== */
let myBet=null,me=ls.get('kp-name')||'',showCode='',joined=false,host=null,myR=null,myA=null,pPeer=null,pConn=null,pState='',retryT=null;
function startPlayer(c){mode='player';showCode=c;$('#pick').hidden=true;$('#ph').classList.add('on');pRender()}
function pConnect(){
  clearTimeout(retryT);
  if(!hasPeer){pState='Die Verbindungsbibliothek konnte nicht geladen werden. Seite neu laden.';return pRender()}
  if(!pPeer||pPeer.destroyed){
    pPeer=new Peer({debug:0});
    pPeer.on('open',()=>dial());
    pPeer.on('disconnected',()=>{setTimeout(()=>{try{pPeer.reconnect()}catch(e){}},1000)});
    pPeer.on('error',e=>{if(e.type==='peer-unavailable'){pState='Show '+showCode+' nicht gefunden. Läuft der große Bildschirm? Ich versuche es weiter.';pRender();retryT=setTimeout(dial,2500)}else{pState='Verbindung hakt, ich versuche es weiter.';pRender();retryT=setTimeout(dial,3000)}});
  }else dial();
}
function dial(){
  clearTimeout(retryT);if(!pPeer||!pPeer.open){retryT=setTimeout(dial,1500);return}
  try{pConn&&pConn.close()}catch(e){}
  pState='Verbinde mit Show '+showCode+' …';pRender();
  const c=pPeer.connect(PFX+showCode,{reliable:true});pConn=c;
  c.on('open',()=>{if(pConn!==c)return;pState='';c.send({t:'hi',name:me});if(host&&myA!=null)c.send({t:'ans',r:host.r,a:myA});pRender()});
  c.on('data',d=>{if(pConn!==c||!d||d.role!=='host')return;host=d;if(host.r!==myR){myR=host.r;myA=null;myBet=null}pRender()});
  c.on('close',()=>{if(pConn!==c)return;pState='Verbindung verloren, verbinde neu …';pRender();retryT=setTimeout(dial,1500)});
}
function myScore(){if(!host||!Array.isArray(host.sc))return null;const i=host.sc.findIndex(x=>key(x[0])===key(me));return i<0?null:{rank:i+1,s:host.sc[i][1],d:host.sc[i][2],of:host.sc.length}}
function pAnswer(i){if(!host||host.ph!=='q'||myA!=null)return;myA=i;try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}try{pConn&&pConn.open&&pConn.send({t:'ans',r:host.r,a:i})}catch(e){}pRender()}
function pRender(){
  const b=$('#pBody'),m=myScore();$('#pMe').textContent=joined?(me+(m?' · '+eur(m.s):'')):'';
  if(!joined){
    b.innerHTML=`<div class="state">Wie heißt du?</div><p class="muted">Dein Name erscheint auf dem großen Bildschirm.</p>
      <form id="jf"><input id="nm" maxlength="20" autocomplete="off" value="${esc(me)}" placeholder="Vorname" aria-label="Name">
      ${showCode?`<p class="muted">Show-Code: <b class="mini">${esc(showCode)}</b></p>`:'<input id="cd" maxlength="6" autocomplete="off" placeholder="Show-Code vom Fernseher" aria-label="Show-Code" style="margin-top:12px;text-transform:uppercase">'}
      <button class="btn" style="margin-top:14px;width:100%">Rein in die Show</button></form>`;
    $('#jf').onsubmit=e=>{e.preventDefault();const v=$('#nm').value.trim();const cd=$('#cd');if(cd)showCode=cd.value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(!v||!showCode)return;me=v.slice(0,20);ls.set('kp-name',me);joined=true;keepAwake();try{history.replaceState(null,'','#'+showCode)}catch(x){}pConnect();pRender()};return;
  }
  if(pState&&!host){b.innerHTML=`<div class="state">Moment …</div><p class="muted">${esc(pState)}</p>`;return}
  if(!host){b.innerHTML=`<div class="state">Du bist drin, ${esc(me)}.</div><p class="muted">Warte auf den großen Bildschirm.</p>`;return}
  const warn=pState?`<p class="warn">${esc(pState)}</p>`:'';
  const ph=host.ph,a=Array.isArray(host.a)?host.a:[];
  if(ph==='lobby'){b.innerHTML=`<div class="state">Du bist drin, ${esc(me)}.</div><p class="muted">Gleich geht's los. Schnell und richtig bringt am meisten.</p>${warn}`;return}
  if(ph==='end'){b.innerHTML=`<div class="state">${m?`Platz ${m.rank} von ${m.of}`:'Show vorbei'}</div><p class="ptimer">${m?eur(m.s):''}</p><p class="muted">Danke fürs Mitspielen.</p>`;return}
  if(ph==='fin'){b.innerHTML=`<div class="state">Finale!</div><p class="ptimer">Gleich setzt du</p><p>Du entscheidest selbst, wie viel du riskierst. Richtig gewinnt den Einsatz dazu, falsch verliert ihn.</p>${warn}`;return}
  if(ph==='bet'){
    const sc=m?m.s:0,mx=sc>0?sc:1000;
    if(myBet!=null){b.innerHTML=`<div class="state">Einsatz gesetzt: ${eur(myBet)}</div><p class="muted">Kein Zurück. Gleich kommt die Finalfrage.</p>${warn}`;return}
    const opts=sc>0?[[0,'Nichts'],[Math.round(mx*.25/100)*100,'25 %'],[Math.round(mx*.5/100)*100,'Die Hälfte'],[Math.round(mx*.75/100)*100,'75 %'],[mx,'ALLES!']]:[[0,'Nichts'],[500,'500 €'],[1000,'1.000 €']];
    b.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><span class="muted">Finale · Dein Konto: ${eur(sc)}</span><span class="ptimer">${host.left|0}</span></div><div class="state">Wie viel setzt du?</div>
      <div class="buzz">${opts.map(([v,l],i)=>`<button class="bz" data-v="${v}" style="background:${ACOL[i%4]}"><span class="l">${esc(l)}</span><span>${eur(v)}</span></button>`).join('')}</div>${warn}`;
    b.querySelectorAll('.bz').forEach(x=>x.onclick=()=>{if(myBet!=null||!host||host.ph!=='bet')return;myBet=+x.dataset.v;try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}try{pConn&&pConn.open&&pConn.send({t:'bet',r:host.r,v:myBet})}catch(e){}pRender()});return;
  }
  if(ph==='intro'){b.innerHTML=`<div class="state">Dis oder Dat!</div><p class="muted">Sechs Sekunden pro Name. Schau auf den Fernseher.</p>${warn}`;return}
  if(ph==='read'){b.innerHTML=`<p class="muted">${esc(host.lab)}</p><div class="state" style="font-size:24px">${esc(host.t)}</div><p class="muted">Hör zu, gleich darfst du drücken.</p>${warn}`;return}
  if(ph==='q'){
    if(myA!=null){b.innerHTML=`<div class="state">Antwort ${host.k==='dd'?esc(a[myA]):LET[myA]} ist eingeloggt.</div><p class="muted">Kein Zurück. Wie im echten Projekt.</p>${warn}`;return}
    b.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><span class="muted">${esc(host.lab)}</span><span class="ptimer">${host.left|0}</span></div>
      ${host.k==='dd'?`<div class="state" style="text-align:center">${esc(host.t)}</div>`:''}
      <div class="buzz">${a.map((t,i)=>`<button class="bz ${host.k==='dd'?'dd2':''}" data-i="${i}" style="background:${ACOL[i]}">${host.k==='dd'?'':`<span class="l">${LET[i]}</span>`}<span>${esc(t)}</span></button>`).join('')}</div>${warn}`;
    b.querySelectorAll('.bz').forEach(x=>x.onclick=()=>pAnswer(+x.dataset.i));return;
  }
  if(ph==='board'||ph==='wait'){
    const sc=Array.isArray(host.sc)?host.sc:[];const ahead=m&&m.rank>1?sc[m.rank-2]:null;
    b.innerHTML=`<p class="muted">Zwischenstand</p><div class="state">${m?`Platz ${m.rank} von ${m.of}`:'Zwischenstand'}</div><p class="ptimer">${m?eur(m.s):'0 €'}</p>
      ${m&&m.rank===1?'<p>Du führst. Jetzt bloß nicht nachlassen.</p>':ahead?`<p>Noch <b>${eur(ahead[1]-m.s)}</b> bis Platz ${m.rank-1} (${esc(ahead[0])}).</p>`:''}${warn}`;return;
  }
  if(ph==='rev'){
    if(host.c==null){b.innerHTML=`<div class="state">Zwischenstand</div><p class="ptimer">${m?eur(m.s):''}</p><p class="muted">${m?`Platz ${m.rank} von ${m.of}`:''}</p>`;return}
    const d=m?m.d:null;
    b.innerHTML=`<div class="state">${d==null?'Keine Antwort':d>0?'Richtig!':'Leider falsch'}</div>
      <p class="ptimer" style="color:${d==null?'var(--soft)':d>0?'var(--a3)':'var(--a2)'}">${d==null?'0 €':(d>0?'+':'')+eur(d)}</p>
      <p class="muted">Richtig war ${host.k==='dd'?'':LET[host.c]+': '}${esc(a[host.c])}</p><p>Kontostand: <b>${m?eur(m.s):'0 €'}</b>${m?` · Platz ${m.rank} von ${m.of}`:''}</p>`;
  }
}
if(hashCode)startPlayer(hashCode);
}
</script>
</body>
</html>
