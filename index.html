<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kein Plan, Herr Berater</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: Kioptra-Abend: präzise, technisch, mit einem Augenzwinkern
   IDEA: ein Kontrollraum-Dashboard im Kioptra-Look: Raster, Monospace-Labels, goldene Akzente
   PICTURE: Frage groß auf dunklem Raster, vier Antwortkacheln mit Farbcode, Zeitbalken in Gold
   COLOUR and TYPE: Kioptra-Navy, Gold #e3b54a, Teal, Blau, Lavendel; IBM Plex Sans und IBM Plex Mono
   LAYOUT: TV: Kopfzeile mit Logo, Bühne, Punkteleiste; Handy: eine Spalte, große Buzzer */
:root{color-scheme:dark;--bg:#0a1422;--panel:#0f1c2e;--panel2:#14263d;--line:rgba(127,166,216,.16);--y:#e3b54a;--ink:#eef3fb;--soft:#aeb9c9;--a0:#e3b54a;--a1:#33c7a6;--a2:#5c9bd6;--a3:#8e84d8;--dark:#0a1422;--red:#e3b54a}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 'IBM Plex Sans',system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent;background-image:radial-gradient(70% 50% at 50% 0%,rgba(63,118,189,.22),transparent 70%),linear-gradient(rgba(127,166,216,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(127,166,216,.07) 1px,transparent 1px);background-size:100% 100%,48px 48px,48px 48px}
button{font:inherit}
.marq{font-family:'IBM Plex Sans',sans-serif;font-weight:700;line-height:1.05;color:var(--ink);letter-spacing:-.01em}
.marq em{font-style:normal;color:var(--y)}
.mono{font-family:'IBM Plex Mono',monospace}
.logo{display:inline-flex;align-items:center;gap:10px}
.logo svg{height:28px;width:auto;flex:none}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px 40px}
.btn{all:unset;cursor:pointer;display:block;text-align:center;background:var(--y);color:var(--dark);font:700 19px/1 'IBM Plex Sans',sans-serif;padding:18px 22px;border-radius:3px;letter-spacing:.02em}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(2px)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line);font-size:16px}
input{width:100%;font:600 21px 'IBM Plex Sans',sans-serif;padding:15px;border-radius:3px;border:1px solid var(--y);background:var(--panel);color:var(--ink)}
input:focus-visible{outline:2px solid var(--y)}
.muted{color:var(--soft);font-size:15px}
.warn{background:rgba(227,181,74,.1);border:1px solid rgba(227,181,74,.4);border-radius:3px;padding:12px 14px;font-size:15px;margin-top:16px}
#pick .marq{font-size:clamp(38px,10vw,68px);margin:22px 0 12px;text-wrap:balance}
#pick .roles{display:grid;gap:14px;margin-top:26px}
.role{all:unset;cursor:pointer;display:block;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--y);border-radius:3px;padding:18px 20px}
.role:focus-visible{outline:2px solid var(--y);outline-offset:3px}
.role b{display:block;font:700 22px/1.2 'IBM Plex Sans',sans-serif}
.role span{color:var(--soft);font-size:15px}
.role.alt{border-left-color:var(--a1)}
#tv{display:none;min-height:100vh;flex-direction:column}
#tv.on{display:flex}
.tbar{display:flex;align-items:center;gap:16px;padding:14px 3vw;border-bottom:1px solid var(--line);background:rgba(10,20,34,.75)}
.tbar .marq{font-size:clamp(15px,1.5vw,20px);font-weight:600}
.tbar .lab{margin-left:auto;font:500 clamp(13px,1.3vw,18px) 'IBM Plex Mono',monospace;color:var(--soft)}
.ibtn{all:unset;cursor:pointer;font:500 14px 'IBM Plex Mono',monospace;padding:8px 12px;border-radius:3px;border:1px solid var(--line);color:var(--soft)}
.ibtn:focus-visible{outline:2px solid var(--y)}
.ibtn.on{border-color:var(--y);color:var(--y)}
select.ibtn{all:revert;font:500 14px 'IBM Plex Mono',monospace;padding:8px 10px;border-radius:3px;border:1px solid var(--line);background:var(--panel);color:var(--ink)}
.stagebox{flex:1;display:flex;flex-direction:column;justify-content:center;padding:1.5vh 4vw 2vh;gap:2vh}
.tbarline{height:6px;background:var(--line);border-radius:0;overflow:hidden}
.tbarline i{display:block;height:100%;background:var(--y);width:100%;transition:width .25s linear}
.tbarline.low i{background:#ff7a6b}
.qtext{font:600 clamp(22px,min(3.5vw,6vh),58px)/1.18 'IBM Plex Sans',sans-serif;text-wrap:balance;max-width:30ch}
.ans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.4vw}
.an{display:flex;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:clamp(10px,min(1.4vw,2.2vh),24px);font:600 clamp(16px,min(2vw,3.5vh),32px)/1.25 'IBM Plex Sans',sans-serif;transition:opacity .3s,transform .3s,border-color .3s}
.an .l{flex:none;width:1.8em;height:1.8em;border-radius:3px;display:grid;place-items:center;color:var(--dark);font:700 1em 'IBM Plex Mono',monospace}
.an .who{display:block;font:500 clamp(12px,1vw,17px)/1.3 'IBM Plex Mono',monospace;color:var(--soft);margin-top:4px}
.an.no{opacity:.3}.an.ok{border-color:var(--y);transform:scale(1.02);background:var(--panel2);box-shadow:0 0 0 1px var(--y),0 0 40px rgba(227,181,74,.2)}
.quip{background:var(--panel2);color:var(--ink);border:1px solid var(--line);border-left:3px solid var(--y);border-radius:3px;padding:12px 20px;font:500 clamp(15px,min(1.6vw,3vh),25px)/1.35 'IBM Plex Sans',sans-serif;max-width:62ch;position:relative}
.quip::before{content:"// Kevin vom Helpdesk";display:block;font:500 13px 'IBM Plex Mono',monospace;color:var(--y);margin-bottom:3px}
.meta{display:flex;gap:18px;align-items:center;flex-wrap:wrap;font:500 clamp(13px,1.3vw,19px) 'IBM Plex Mono',monospace;color:var(--soft)}
.pill{background:transparent;color:var(--y);border:1px solid var(--y);padding:5px 12px;border-radius:2px}
.big{font-size:clamp(48px,8vw,130px)}
.dd{display:grid;grid-template-columns:1fr 1fr;gap:2vw;margin-top:1vh}
.dd .an{justify-content:center;font-size:clamp(20px,2.8vw,44px)}
.item{font:700 clamp(44px,min(9vw,16vh),140px)/1 'IBM Plex Sans',sans-serif;text-align:center;letter-spacing:-.02em;color:var(--y)}
.players{display:flex;flex-wrap:wrap;gap:10px}
.pl{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:8px 14px;font:600 clamp(15px,1.5vw,22px) 'IBM Plex Sans',sans-serif}
.sbar{display:flex;gap:10px;padding:10px 3vw 14px;overflow-x:auto;border-top:1px solid var(--line);background:rgba(10,20,34,.85)}
.sc{flex:none;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:7px 14px;min-width:120px}
.sc b{display:block;font:500 13px 'IBM Plex Mono',monospace;color:var(--soft);white-space:nowrap}
.sc span{font:700 19px 'IBM Plex Sans',sans-serif;white-space:nowrap;font-variant-numeric:tabular-nums}
.sc em{font-style:normal;font:600 13px 'IBM Plex Mono',monospace;margin-left:6px}
.pos{color:var(--a1)}.neg{color:#ff7a6b}
.sc.done{border-color:var(--y)}
.podium{display:grid;gap:8px;max-width:900px}
.podium div{display:flex;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:12px 22px;font:600 clamp(19px,2.2vw,34px) 'IBM Plex Sans',sans-serif}
.podium div:first-child{background:var(--y);color:var(--dark);border-color:var(--y)}
.hint{font:500 clamp(13px,1.2vw,18px) 'IBM Plex Mono',monospace;color:var(--soft)}
#ph{display:none}#ph.on{display:block}
.pbar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--line);background:rgba(10,20,34,.9);font:600 15px 'IBM Plex Sans',sans-serif}
.pbar .logo svg{height:22px}
.pbody{padding:18px 16px 40px;max-width:560px;margin:0 auto}
.buzz{display:grid;gap:12px;margin-top:14px}
.bz{all:unset;cursor:pointer;display:flex;gap:14px;align-items:center;min-height:64px;padding:14px 16px;border-radius:3px;color:var(--dark);font:700 19px/1.25 'IBM Plex Sans',sans-serif}
.bz:active{transform:scale(.98)}
.bz:focus-visible{outline:2px solid var(--ink)}
.bz .l{font:700 22px 'IBM Plex Mono',monospace;flex:none}
.bz.dd2{min-height:120px;justify-content:center;font-size:26px}
.state{font:700 clamp(28px,8.5vw,42px)/1.12 'IBM Plex Sans',sans-serif;margin:24px 0 8px;text-wrap:balance}
.ptimer{font:600 38px 'IBM Plex Mono',monospace;color:var(--y)}
@media(max-width:700px){.ans{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
.qrbox{display:flex;gap:3vw;align-items:center;flex-wrap:wrap}
.qr{background:#eef3fb;padding:14px;border-radius:3px;width:clamp(180px,22vw,300px);aspect-ratio:1}
.qr svg{width:100%;height:100%;display:block}
.code{font:600 clamp(40px,6vw,96px)/1 'IBM Plex Mono',monospace;color:var(--y);letter-spacing:.08em}
.mini{font-family:'IBM Plex Mono',monospace;color:var(--y);font-size:clamp(14px,1.4vw,20px)}
.auto{font:500 14px 'IBM Plex Mono',monospace;color:var(--soft)}
body.fxon{background:var(--bg);background-image:none}
#fx{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
#tv{position:relative;z-index:1}
body.fxon .tbar,body.fxon .sbar{background:rgba(10,20,34,.92)}
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
@keyframes win{0%{transform:scale(1)}40%{transform:scale(1.07)}100%{transform:scale(1.02)}}
@keyframes glow{0%,100%{box-shadow:0 0 0 1px var(--y),0 0 30px rgba(227,181,74,.25)}50%{box-shadow:0 0 0 2px var(--y),0 0 70px rgba(227,181,74,.55)}}
@keyframes tick{0%,100%{opacity:1}50%{opacity:.35}}
.stagebox.fresh .qtext,.stagebox.fresh .marq,.stagebox.fresh .item{animation:rise .55s cubic-bezier(.2,.8,.2,1) both}
.stagebox.fresh .an,.stagebox.fresh .brow,.stagebox.fresh .quip,.stagebox.fresh .podium div{animation:rise .5s cubic-bezier(.2,.8,.2,1) both}
.stagebox.fresh .an:nth-child(2),.stagebox.fresh .brow:nth-child(2){animation-delay:.08s}.stagebox.fresh .an:nth-child(3),.stagebox.fresh .brow:nth-child(3){animation-delay:.16s}.stagebox.fresh .an:nth-child(4),.stagebox.fresh .brow:nth-child(4){animation-delay:.24s}.stagebox.fresh .brow:nth-child(n+5){animation-delay:.32s}
.stagebox.fresh .an.ok{animation:win .7s cubic-bezier(.2,.8,.2,1) both,glow 1.6s ease-in-out .7s infinite}
.an,.brow,.quip,.pl,.sc{background-color:rgba(15,28,46,.86)}
.tbarline.low{animation:tick .5s infinite}
.stagebox.fresh .an.no{animation:none}
.board{display:grid;gap:8px;max-width:1300px}
.brow{display:grid;grid-template-columns:2.2em minmax(6em,14em) 1fr auto 7em;gap:16px;align-items:center;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:clamp(6px,1.1vh,14px) 18px;font:600 clamp(16px,min(2vw,3.4vh),32px) 'IBM Plex Sans',sans-serif}
.brow.lead{border-color:var(--y);box-shadow:0 0 30px rgba(227,181,74,.18)}
.bpos{font:700 1.1em 'IBM Plex Mono',monospace;color:var(--y)}
.bname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bname i{font-style:normal;font:600 .6em 'IBM Plex Mono',monospace;margin-left:10px}
.up{color:var(--a1)}.dn{color:#ff7a6b}
.bbar{height:.55em;background:rgba(127,166,216,.12)}
.bbar i{display:block;height:100%;background:var(--y);transition:width .8s ease}
.bval{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.bd{font:600 .7em 'IBM Plex Mono',monospace;text-align:right;white-space:nowrap;color:var(--soft)}
.sc.lead{border-color:var(--y);background:var(--panel2)}
.sc span{font-size:22px}
</style>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.149.0/build/three.min.js"></script>
</head>

<script>
{
const QS=[
{i:'Willkommen bei Kein Plan, Herr Berater! Erste Frage, zum Aufwärmen. Bitte nicht verletzen.',q:'Laut der 90-90-Regel brauchen die ersten 90 Prozent des Codes 90 Prozent der Zeit. Und die restlichen 10 Prozent?',a:['10 Prozent der Zeit','Noch einmal 90 Prozent','Genau bis zum Go-Live','Die macht die Hypercare'],c:1,r:'Noch mal 90 Prozent. Macht zusammen 180 Prozent. Genau so steht es auch auf eurer Rechnung.'},
{i:'Stellt euch vor, euer Projekt ist verspätet. Ich weiß, schwer vorstellbar.',q:'Was passiert laut Brooks’s Law, wenn man einem verspäteten Softwareprojekt mehr Leute gibt?',a:['Es wird pünktlich','Es wird noch später','Teurer, aber pünktlich','Der Kunde merkt nichts'],c:1,r:'Noch später! Neun Leute bekommen auch kein Baby in einem Monat. Sagt Brooks, nicht ich.'},
{i:'Geschichtsstunde. Kaffee runter, Augen auf.',q:'1947 fand das Team um Grace Hopper im Harvard Mark II den ersten echten Bug. Was war es?',a:['Eine Motte','Eine Kakerlake','Eine Stubenfliege','Ein Praktikant'],c:0,r:'Eine Motte. Sie wurde ins Logbuch geklebt. Debugging im wörtlichsten Sinne.'},
{i:'Jetzt etwas für die Web-Leute unter euch. Beide.',q:'Welcher HTTP-Statuscode bedeutet offiziell „I’m a teapot“?',a:['404','418','451','503'],c:1,r:'418! Ein Aprilscherz von 1998, der es bis in echte Server geschafft hat. Wie die meisten Anforderungen eurer Kunden.'},
{i:'Jetzt wird es akademisch. Wer hier rät, moderiert morgen den Workshop.',q:'Welches Gesetz sagt: Systeme spiegeln die Kommunikationsstruktur der Organisation, die sie baut?',a:['Parkinsons Gesetz','Das Peter-Prinzip','Conways Gesetz','Murphys Gesetz'],c:2,r:'Conway! Drei Abteilungen, die nicht miteinander reden, bauen drei Systeme, die nicht miteinander reden. Grüße an jede Schnittstelle.'},
{i:'Ab jetzt doppelter Tagessatz. Der Kunde stellt hohe Ansprüche.',q:'Der Kunde will 99,999 Prozent Verfügbarkeit. Wie viel Ausfall pro Jahr ist dann noch erlaubt?',a:['Etwa 5 Minuten','Etwa 53 Minuten','Etwa 9 Stunden','Ein Freitagnachmittag'],c:0,r:'Rund 5 Minuten im Jahr. Ungefähr so lange, wie ihr im Teams-Call euer Mikro sucht.'},
{dd:1},
{i:'Zurück zu den normalen Fragen. Normal im Sinne von Beratung.',q:'Woher stammt der Begriff Spam für unerwünschte Mails?',a:['Aus einem Monty-Python-Sketch','„Send Phenomenal Amounts of Mail“','Aus einem Militärcode','Von einem genervten Admin'],c:0,r:'Monty Python! Im Sketch wird so lange Spam gesungen, bis niemand mehr etwas anderes versteht. Wie in eurem Postfach.'},
{i:'Eine Frage für alle, die schon mal eine Konfigurationsdatei gehasst haben. Also alle.',q:'Wofür steht das Y in YAML?',a:['Yet','YAML','Your','Yoga'],c:1,r:'YAML Ain’t Markup Language. Ein rekursives Akronym. Entwickler finden so etwas witzig. Sonst finden sie nur Einrückungsfehler.'},
{i:'Sprachkurs mit Kevin.',q:'Das Wort Roboter kommt aus dem Tschechischen. Was bedeutete „robota“ ursprünglich?',a:['Blechmann','Fronarbeit','Rechenknecht','Unbezahlte Überstunden'],c:1,r:'Fronarbeit. Unbezahlte Überstunden war aber verdammt nah dran.'},
{i:'Die Scrum Master im Raum, bitte jetzt nicht vorsagen.',q:'Welches dieser Events gibt es im Scrum Guide NICHT?',a:['Sprint Review','Daily Scrum','Sprint Retrospective','Sprint Recovery Brunch'],c:3,r:'Der Recovery Brunch ist leider nicht offiziell. Wer ihn trotzdem einführt: Ich bin dabei.'},
{i:'Jetzt dreifacher Tagessatz. Und eine Frage für die Datenschutz-Fraktion.',q:'Bis zu wie viel Prozent des weltweiten Jahresumsatzes darf ein DSGVO-Bußgeld betragen?',a:['1 Prozent','2 Prozent','4 Prozent','10 Prozent'],c:2,r:'4 Prozent oder 20 Millionen Euro, je nachdem, was höher ist. Irgendwer hier nickt gerade sehr zufrieden.'},
{i:'Eine Frage für Leute, die gern frühzeitig Angebote schreiben.',q:'In welchem Jahr läuft die vorzeichenbehaftete 32-Bit-Unix-Zeit über?',a:['2025','2038','2049','Nie, wir sind in der Cloud'],c:1,r:'Am 19. Januar 2038. Tragt euch das ein. Das wird der beste Tagessatz eures Lebens.'},

  }
  if(ph==='rev'){
    if(host.c==null){b.innerHTML=`<div class="state">Zwischenstand</div><p class="ptimer">${m?eur(m.s):''}</p><p class="muted">${m?`Platz ${m.rank} von ${m.of}`:''}</p>`;return}
    const d=m?m.d:null;
    b.innerHTML=`<div class="state">${d==null?'Keine Antwort':d>0?'Richtig!':'Leider falsch'}</div>
      <p class="ptimer" style="color:${d==null?'var(--soft)':d>0?'var(--a3)':'var(--a2)'}">${d==null?'0 €':(d>0?'+':'')+eur(d)}</p>
      <p class="muted">Richtig war ${host.k==='dd'?'':LET[host.c]+': '}${esc(a[host.c])}</p><p>Kontostand: <b>${m?eur(m.s):'0 €'}</b>${m?` · Platz ${m.rank} von ${m.of}`:''}</p>`;
  }
}
if(hashCode)startPlayer(hashCode);
}
</script>
