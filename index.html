<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kein Plan, Herr Berater</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800;900&family=Bungee&display=swap" rel="stylesheet">
<style>
/* VOICE: freche Fernseh-Quizshow, ein Moderator mit losem Mundwerk, Publikum mit Handys als Buzzer
   IDEA: das Studio einer Samstagabend-Show: Leuchtschrift, Antwortfelder, Punktestand als Tagessatz in Euro
   PICTURE: auf dem TV die Frage riesig mit vier Antwortfeldern und Zeitbalken, auf dem Handy vier fette Buzzer
   COLOUR and TYPE: Studio-Rot als Fläche, tiefes Weinrot als Bühne, Gelb als Licht; Bungee für Leuchtschrift, Archivo für alles andere
   LAYOUT: TV: Kopfzeile, Bühne, Punkteleiste unten; Handy: eine Spalte, Buttons über die volle Breite */
:root{color-scheme:dark;--red:#e8322a;--stage:#2b0c12;--stage2:#3d1119;--y:#ffd23f;--ink:#fff6ea;--soft:#f3c9c4;--a0:#ffd23f;--a1:#5fd0f3;--a2:#ff7aa8;--a3:#9be37a;--dark:#1d0a0e}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--stage);color:var(--ink);font:17px/1.45 Archivo,system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent}
button{font:inherit}
.marq{font-family:Bungee,Archivo,sans-serif;font-weight:400;line-height:1;color:var(--y);text-shadow:0 3px 0 #a3140f,0 0 28px rgba(255,210,63,.35)}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px 40px}
.btn{all:unset;cursor:pointer;display:block;text-align:center;background:var(--y);color:var(--dark);font:900 20px/1 Archivo,sans-serif;padding:20px;border-radius:14px;box-shadow:0 5px 0 #b48d10}
.btn:active{transform:translateY(3px);box-shadow:0 2px 0 #b48d10}
.btn:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--ink);border:2px solid rgba(255,255,255,.3);box-shadow:none;font-size:17px;padding:15px}
.btn[disabled]{opacity:.4;pointer-events:none}
input{width:100%;font:700 22px Archivo,sans-serif;padding:16px;border-radius:12px;border:3px solid var(--y);background:var(--dark);color:var(--ink)}
input:focus-visible{outline:3px solid var(--ink)}
.muted{color:var(--soft);font-size:15px}
.warn{background:#5b1520;border:1px solid #a33;border-radius:12px;padding:12px 14px;font-size:15px;margin-top:16px}
/* Rollenwahl */
#pick .marq{font-size:clamp(40px,11vw,76px);margin:18px 0 10px;text-wrap:balance}
#pick .roles{display:grid;gap:14px;margin-top:26px}
.role{all:unset;cursor:pointer;display:block;background:var(--red);border-radius:16px;padding:20px;box-shadow:0 6px 0 #8f150f}
.role:focus-visible{outline:3px solid var(--y);outline-offset:3px}
.role b{display:block;font:900 24px/1.1 Archivo,sans-serif}
.role span{color:#ffe1dc;font-size:15px}
.role.alt{background:var(--stage2);box-shadow:0 6px 0 #170508}
/* TV */
#tv{display:none;min-height:100vh;flex-direction:column;background:radial-gradient(120% 80% at 50% 0%,var(--red) 0%,#a3140f 38%,var(--stage) 78%)}
#tv.on{display:flex}
.tbar{display:flex;align-items:center;gap:16px;padding:14px 3vw}
.tbar .marq{font-size:clamp(18px,2vw,26px)}
.tbar .lab{margin-left:auto;font-weight:800;font-size:clamp(15px,1.6vw,22px)}
.ibtn{all:unset;cursor:pointer;font-weight:700;font-size:15px;padding:9px 14px;border-radius:999px;background:rgba(0,0,0,.25)}
.ibtn:focus-visible{outline:2px solid var(--y)}
.stagebox{flex:1;display:flex;flex-direction:column;justify-content:center;padding:1vh 4vw 2vh;gap:2vh}
.tbarline{height:14px;background:rgba(0,0,0,.35);border-radius:99px;overflow:hidden}
.tbarline i{display:block;height:100%;background:var(--y);width:100%;transition:width .25s linear}
.tbarline.low i{background:#fff}
.qtext{font:800 clamp(22px,min(3.6vw,6.2vh),60px)/1.15 Archivo,sans-serif;text-wrap:balance;max-width:28ch}
.ans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:1.6vw}
.an{display:flex;gap:16px;align-items:center;background:var(--dark);border-radius:16px;padding:clamp(10px,min(1.4vw,2.2vh),24px);font:800 clamp(16px,min(2.1vw,3.6vh),34px)/1.2 Archivo,sans-serif;border:4px solid transparent;transition:opacity .3s,transform .3s}
.an .l{flex:none;width:1.8em;height:1.8em;border-radius:10px;display:grid;place-items:center;color:var(--dark);font-family:Bungee,sans-serif;font-weight:400}
.an .who{display:block;font:600 clamp(13px,1.1vw,18px)/1.3 Archivo,sans-serif;color:var(--soft);margin-top:4px}
.an.no{opacity:.35}.an.ok{border-color:var(--y);transform:scale(1.03);background:#3a2a05}
.quip{background:var(--ink);color:var(--dark);border-radius:18px;padding:12px 20px;font:700 clamp(15px,min(1.7vw,3vh),26px)/1.3 Archivo,sans-serif;max-width:60ch;position:relative}
.quip::before{content:"Kevin vom Helpdesk";display:block;font:900 13px Archivo,sans-serif;color:var(--red);margin-bottom:2px}
.meta{display:flex;gap:18px;align-items:center;flex-wrap:wrap;font-weight:800;font-size:clamp(15px,1.5vw,22px)}
.pill{background:var(--y);color:var(--dark);padding:6px 14px;border-radius:999px}
.big{font-size:clamp(56px,9vw,150px)}
.dd{display:grid;grid-template-columns:1fr 1fr;gap:2vw;margin-top:1vh}
.dd .an{justify-content:center;font-size:clamp(22px,3vw,48px)}
.item{font:900 clamp(44px,min(9vw,16vh),140px)/1 Archivo,sans-serif;text-align:center;letter-spacing:-.01em}
.players{display:flex;flex-wrap:wrap;gap:12px}
.pl{background:var(--dark);border-radius:12px;padding:10px 16px;font-weight:800;font-size:clamp(16px,1.6vw,24px)}
.sbar{display:flex;gap:10px;padding:12px 3vw 16px;overflow-x:auto;background:rgba(0,0,0,.3)}
.sc{flex:none;background:var(--dark);border-radius:12px;padding:8px 14px;min-width:120px}
.sc b{display:block;font-size:15px;white-space:nowrap}
.sc span{font:800 20px Archivo,sans-serif;white-space:nowrap;font-variant-numeric:tabular-nums}
.sc em{font-style:normal;font-weight:800;font-size:14px;margin-left:6px}
.pos{color:var(--a3)}.neg{color:var(--a2)}
.sc.done{outline:3px solid var(--y)}
.podium{display:grid;gap:10px;max-width:900px}
.podium div{display:flex;justify-content:space-between;background:var(--dark);border-radius:14px;padding:14px 22px;font:800 clamp(20px,2.4vw,36px) Archivo,sans-serif}
.podium div:first-child{background:var(--y);color:var(--dark)}
.hint{font-size:clamp(14px,1.3vw,19px);color:var(--soft)}
/* Handy */
#ph{display:none}#ph.on{display:block}
.pbar{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:var(--red);font-weight:800}
.pbar .marq{font-size:16px}
.pbody{padding:18px 16px 40px;max-width:560px;margin:0 auto}
.buzz{display:grid;gap:12px;margin-top:14px}
.bz{all:unset;cursor:pointer;display:flex;gap:14px;align-items:center;min-height:64px;padding:14px 16px;border-radius:16px;color:var(--dark);font:800 19px/1.2 Archivo,sans-serif;box-shadow:0 5px 0 rgba(0,0,0,.35)}
.bz:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.35)}
.bz:focus-visible{outline:3px solid var(--ink)}
.bz .l{font-family:Bungee,sans-serif;font-weight:400;font-size:24px;flex:none}
.bz.dd2{min-height:120px;justify-content:center;font-size:26px}
.state{font:900 clamp(30px,9vw,44px)/1.1 Archivo,sans-serif;margin:24px 0 8px;text-wrap:balance}
.ptimer{font:400 40px Bungee,sans-serif;color:var(--y)}
@media(max-width:700px){.ans{grid-template-columns:1fr}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
<style>
.qrbox{display:flex;gap:3vw;align-items:center;flex-wrap:wrap}
.qr{background:#fff;padding:14px;border-radius:16px;width:clamp(180px,22vw,300px);aspect-ratio:1}
.qr svg{width:100%;height:100%;display:block}
.code{font:400 clamp(40px,6vw,96px)/1 Bungee,sans-serif;color:var(--y);letter-spacing:.06em}
.mini{font-family:Bungee,sans-serif;color:var(--y);font-size:clamp(15px,1.6vw,22px)}
</style>
<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.4/dist/peerjs.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/qrcode-generator@1.4.4/qrcode.js"></script>
</head>
<body>

<section id="pick" class="wrap">
  <div class="marq">Kein Plan, Herr Berater</div>
  <p>Die Quizshow für Leute, die für Wissen Tagessätze nehmen. Ein großer Bildschirm zeigt die Show, alle anderen spielen mit dem Handy.</p>
  <div class="roles">
    <button class="role alt" id="asHost"><b>Großer Bildschirm</b><span>Auf dem Fernseher, dem Laptop oder einem Handy, das aufs TV gespiegelt wird. Zeigt den QR-Code zum Mitspielen.</span></button>
    <button class="role" id="asPlayer"><b>Mitspielen</b><span>Lieber den QR-Code auf dem Fernseher scannen. Oder hier den Show-Code eintippen.</span></button>
  </div>
</section>

<div id="tv">
  <div class="tbar"><span class="marq">Kein Plan, Herr Berater</span><span class="lab" id="tLab"></span><span class="mini" id="tCode"></span><button class="ibtn" id="mute">Ton an</button></div>
  <div class="stagebox" id="stage"></div>
  <div class="sbar" id="sbar"></div>
</div>

<div id="ph">
  <div class="pbar"><span class="marq">Kein Plan</span><span id="pMe"></span></div>
  <div class="pbody" id="pBody"></div>
</div>

<script>
{
const QS=[
{i:'Willkommen bei Kein Plan, Herr Berater! Erste Frage, zum Aufwärmen. Bitte nicht verletzen.',q:'Laut der 90-90-Regel brauchen die ersten 90 Prozent des Codes 90 Prozent der Zeit. Und die restlichen 10 Prozent?',a:['10 Prozent der Zeit','Noch einmal 90 Prozent','Genau bis zum Go-Live','Die macht die Hypercare'],c:1,r:'Noch mal 90 Prozent. Macht zusammen 180 Prozent. Genau so steht es auch auf eurer Rechnung.'},
{i:'Stellt euch vor, euer Projekt ist verspätet. Ich weiß, schwer vorstellbar.',q:'Was passiert laut Brooks’s Law, wenn man einem verspäteten Softwareprojekt mehr Leute gibt?',a:['Es wird pünktlich','Es wird noch später','Teurer, aber pünktlich','Der Kunde merkt nichts'],c:1,r:'Noch später! Neun Leute bekommen auch kein Baby in einem Monat. Sagt Brooks, nicht ich.'},
{i:'Geschichtsstunde. Kaffee runter, Augen auf.',q:'1947 fand das Team um Grace Hopper im Harvard Mark II den ersten echten Bug. Was war es?',a:['Eine Motte','Eine Kakerlake','Eine Stubenfliege','Ein Praktikant'],c:0,r:'Eine Motte. Sie wurde ins Logbuch geklebt. Debugging im wörtlichsten Sinne.'},
{i:'Jetzt etwas für die Web-Leute unter euch. Beide.',q:'Welcher HTTP-Statuscode bedeutet offiziell „I’m a teapot“?',a:['404','418','451','503'],c:1,r:'418! Ein Aprilscherz von 1998, der es bis in echte Server geschafft hat. Wie die meisten Anforderungen eurer Kunden.'},
{i:'Jetzt wird es akademisch. Wer hier rät, moderiert morgen den Workshop.',q:'Welches Gesetz sagt: Systeme spiegeln die Kommunikationsstruktur der Organisation, die sie baut?',a:['Parkinsons Gesetz','Das Peter-Prinzip','Conways Gesetz','Murphys Gesetz'],c:2,r:'Conway! Drei Abteilungen, die nicht miteinander reden, bauen drei Systeme, die nicht miteinander reden. Grüße an jede Schnittstelle.'},
{i:'Ab jetzt doppelter Tagessatz. Der Kunde stellt hohe Ansprüche.',q:'Der Kunde will 99,999 Prozent Verfügbarkeit. Wie viel Ausfall pro Jahr ist dann noch erlaubt?',a:['Etwa 5 Minuten','Etwa 53 Minuten','Etwa 9 Stunden','Ein Freitagnachmittag'],c:0,r:'Rund 5 Minuten im Jahr. Ungefähr so lange, wie ihr im Teams-Call euer Mikro sucht.'},
{dd:1},
{i:'Zurück zu den normalen Fragen. Normal im Sinne von Beratung.',q:'Woher stammt der Begriff Spam für unerwünschte Mails?',a:['Aus einem Monty-Python-Sketch','„Send Phenomenal Amounts of Mail“','Aus einem Militärcode','Von einem genervten Admin'],c:0,r:'Monty Python! Im Sketch wird so lange Spam gesungen, bis niemand mehr etwas anderes versteht. Wie in eurem Postfach.'},
{i:'Eine Frage für alle, die schon mal eine Konfigurationsdatei gehasst haben. Also alle.',q:'Wofür steht das Y in YAML?',a:['Yet','YAML','Your','Yoga'],c:1,r:'YAML Ain’t Markup Language. Ein rekursives Akronym. Entwickler finden so etwas witzig. Sonst finden sie nur Einrückungsfehler.'},
{i:'Sprachkurs mit Kevin.',q:'Das Wort Roboter kommt aus dem Tschechischen. Was bedeutete „robota“ ursprünglich?',a:['Blechmann','Fronarbeit','Rechenknecht','Unbezahlte Überstunden'],c:1,r:'Fronarbeit. Unbezahlte Überstunden war aber verdammt nah dran.'},
{i:'Die Scrum Master im Raum, bitte jetzt nicht vorsagen.',q:'Welches dieser Events gibt es im Scrum Guide NICHT?',a:['Sprint Review','Daily Scrum','Sprint Retrospective','Sprint Recovery Brunch'],c:3,r:'Der Recovery Brunch ist leider nicht offiziell. Wer ihn trotzdem einführt: Ich bin dabei.'},
{i:'Jetzt dreifacher Tagessatz. Und eine Frage für die Datenschutz-Fraktion.',q:'Bis zu wie viel Prozent des weltweiten Jahresumsatzes darf ein DSGVO-Bußgeld betragen?',a:['1 Prozent','2 Prozent','4 Prozent','10 Prozent'],c:2,r:'4 Prozent oder 20 Millionen Euro, je nachdem, was höher ist. Irgendwer hier nickt gerade sehr zufrieden.'},
{i:'Eine Frage für Leute, die gern frühzeitig Angebote schreiben.',q:'In welchem Jahr läuft die vorzeichenbehaftete 32-Bit-Unix-Zeit über?',a:['2025','2038','2049','Nie, wir sind in der Cloud'],c:1,r:'Am 19. Januar 2038. Tragt euch das ein. Das wird der beste Tagessatz eures Lebens.'},
{i:'Fast geschafft. Jetzt etwas Methodik.',q:'Was ist Rubber Duck Debugging?',a:['Testen in der Badewanne','Einer Gummiente den Code erklären, bis man den Fehler selbst findet','Ein Tool, das bei Fehlern quakt','Bugs an den Junior delegieren'],c:1,r:'Man erklärt der Ente den Code und findet den Fehler selbst. Berater nennen das übrigens Workshop.'},
{i:'Vorletzte Frage. Rechnet mit.',q:'Wie viele Bytes hat ein Kibibyte?',a:['1000','1024','1048','Kommt auf den Vertrieb an'],c:1,r:'1024. Ein Kilobyte hat 1000. Ja, wirklich. Nein, das wusste vorher niemand.'},
{i:'Die Finalfrage! Jetzt geht es um alles. Oder zumindest um die Ehre.',q:'Wer machte „Hello, World!“ als erstes Beispielprogramm berühmt?',a:['Bill Gates','Brian Kernighan','Linus Torvalds','Ada Lovelace'],c:1,r:'Brian Kernighan von den Bell Labs. Seitdem beginnt jede IT-Karriere mit einer kleinen Lüge: Hallo Welt, ich bleib nur kurz.'}
];
const DD={i:'Dis oder Dat! Ich nenne euch Namen. Ihr sagt mir: Pokémon oder Big-Data-Tool? Sechs Sekunden pro Name. Richtig gibt 500 Euro, falsch kostet 500.',opts:['Pokémon','Big-Data-Tool'],items:[['Hadoop',1],['Nidoking',0],['Kafka',1],['Porygon',0],['Flink',1],['Feraligatr',0],['Druid',1],['Rhydon',0]]};

const ACOL=['var(--a0)','var(--a1)','var(--a2)','var(--a3)'],LET='ABCD';
const $=s=>document.querySelector(s);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const eur=n=>(n<0?'−':'')+Math.abs(n).toLocaleString('de-DE')+' €';
const key=n=>String(n||'').trim().toLowerCase().slice(0,24);
const ls={get(k){try{return localStorage.getItem(k)}catch(e){return null}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const PFX='kein-plan-berater-';
const hasPeer=typeof window.Peer==='function';
let mode=null,wake=null;
function keepAwake(){try{navigator.wakeLock&&navigator.wakeLock.request('screen').then(w=>wake=w).catch(()=>{})}catch(e){}}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&mode)keepAwake()});
const hashCode=(location.hash||'').replace('#','').toUpperCase().replace(/[^A-Z0-9]/g,'').slice(0,6);
$('#asHost').onclick=()=>{mode='host';$('#pick').hidden=true;$('#tv').classList.add('on');keepAwake();hostInit();hostNet()};
$('#asPlayer').onclick=()=>startPlayer('');

/* ========== HOST ========== */
let G=null,muted=false,tick=null,beepCtx=null,peer=null,code=null,netOk=false,netErr='';
const conns=new Map();
function beep(f,d){try{beepCtx=beepCtx||new (window.AudioContext||window.webkitAudioContext)();const o=beepCtx.createOscillator(),g=beepCtx.createGain();o.frequency.value=f;g.gain.value=.12;o.connect(g);g.connect(beepCtx.destination);o.start();o.stop(beepCtx.currentTime+d)}catch(e){}}
let voice=null;
function pickVoice(){try{const v=speechSynthesis.getVoices().filter(v=>/^de/i.test(v.lang));voice=v.find(x=>/google/i.test(x.name))||v[0]||null}catch(e){}}
try{pickVoice();speechSynthesis.onvoiceschanged=pickVoice}catch(e){}
function say(txt,wait){
  const est=Math.min(14000,1500+txt.split(' ').length*330);
  if(muted||!window.speechSynthesis)return new Promise(r=>setTimeout(r,wait?Math.min(9000,est):0));
  return new Promise(res=>{let done=false;const fin=()=>{if(!done){done=true;res()}};
    try{speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(txt);u.lang='de-DE';if(voice)u.voice=voice;u.rate=1.05;u.onend=fin;u.onerror=fin;speechSynthesis.speak(u)}catch(e){fin()}
    setTimeout(fin,est+4000)});
}
function hush(){try{speechSynthesis.cancel()}catch(e){}}
$('#mute').onclick=()=>{muted=!muted;if(muted)hush();$('#mute').textContent=muted?'Ton aus':'Ton an'};
function buildPlan(){
  const p=[];let n=0;const total=QS.filter(q=>!q.dd).length;
  QS.forEach(q=>{
    if(q.dd){p.push({k:'ddi'});shuffle(DD.items).forEach((it,j)=>p.push({k:'dd',t:it[0],c:it[1],a:DD.opts,n:j+1,of:DD.items.length,val:500}));p.push({k:'dde'});return}
    n++;p.push(Object.assign({k:'q',n,of:total,val:n<=5?1000:n<=11?2000:3000},q));
  });return p;
}
function hostInit(){G={id:Math.random().toString(36).slice(2,7),step:-1,plan:buildPlan(),scores:{},ans:{},ph:'lobby',last:{}};hRender();hPub()}
function newCode(){const A='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';let s='';for(let i=0;i<4;i++)s+=A[Math.floor(Math.random()*A.length)];return s}
function hostNet(retry){
  if(!hasPeer){netErr='Die Verbindungsbibliothek konnte nicht geladen werden.';return hRender()}
  code=(!retry&&ls.get('kp-host-code'))||newCode();ls.set('kp-host-code',code);
  peer=new Peer(PFX+code,{debug:0});
  peer.on('open',()=>{netOk=true;netErr='';hRender()});
  peer.on('connection',c=>{
    c.on('open',()=>{conns.set(c.peer,{c,name:null,r:null,a:null});sendTo(c)});
    c.on('data',d=>onMsg(c.peer,d));
    c.on('close',()=>{conns.delete(c.peer);onChange()});
    c.on('error',()=>{});
  });
  peer.on('disconnected',()=>{netOk=false;hRender();setTimeout(()=>{try{peer.reconnect()}catch(e){}},1000)});
  peer.on('error',e=>{if(e.type==='unavailable-id'){try{peer.destroy()}catch(x){}hostNet(true)}else if(e.type==='network'||e.type==='server-error'||e.type==='socket-error'){netOk=false;netErr='Verbindung zum Vermittlungsserver hakt. Ich versuche es weiter.';hRender()}});
  hRender();
}
function joinUrl(){return location.origin+location.pathname+'#'+code}
function onMsg(id,d){
  const x=conns.get(id);if(!x||!d||typeof d!=='object')return;
  if(d.t==='hi'&&typeof d.name==='string'){x.name=d.name.slice(0,20)}
  if(d.t==='ans'&&typeof d.r==='string'&&Number.isInteger(d.a)){x.r=d.r;x.a=d.a}
  onChange();
}
function onChange(){if(!G)return;hCollect();if(G.ph==='lobby')hRender();else hScore()}
function livePlayers(){return [...conns.values()].filter(x=>x.name&&key(x.name))}
function hCollect(){
  const rid=G.id+'-'+G.step;
  for(const p of livePlayers()){
    const k=key(p.name);
    if(!G.scores[k]){G.scores[k]={n:p.name,s:0};hPubSoon()}
    if(G.ph==='q'&&p.r===rid&&Number.isInteger(p.a)&&!G.ans[k]){G.ans[k]={a:p.a,t:Date.now()-G.t0};beep(740,.05)}
  }
  if(G.ph==='q'){const live=livePlayers().map(p=>key(p.name));if(live.length&&live.every(k=>G.ans[k]))hReveal()}
}
let pubT=null;function hPubSoon(){clearTimeout(pubT);pubT=setTimeout(hPub,50)}
function cur(){return G.plan[G.step]}
function state(){
  const s=cur()||{};
  const sc=Object.values(G.scores).sort((a,b)=>b.s-a.s).slice(0,40).map(x=>[x.n,x.s,G.last[key(x.n)]==null?null:G.last[key(x.n)]]);
  return {role:'host',g:G.id,ph:G.ph,r:G.id+'-'+G.step,k:s.k||'',lab:hLabel(),t:s.k==='q'?s.q:s.k==='dd'?s.t:'',a:s.a||[],left:G.left||0,c:G.ph==='rev'&&s.c!=null?s.c:null,sc};
}
function sendTo(c){try{c.open&&c.send(state())}catch(e){}}
function hPub(){if(!G)return;for(const x of conns.values())sendTo(x.c)}
function hLabel(){const s=cur();if(!s||G.ph==='lobby')return 'Lobby';if(G.ph==='end')return 'Finale';if(s.k==='q')return `Frage ${s.n} von ${s.of} · ${eur(s.val)}`;return 'Dis oder Dat'}
function next(){
  hush();clearInterval(tick);G.step++;G.last={};const s=cur();
  if(!s){G.ph='end';hRender();hPub();beep(523,.15);setTimeout(()=>beep(659,.15),160);setTimeout(()=>beep(784,.4),320);
    const top=Object.values(G.scores).sort((a,b)=>b.s-a.s)[0];say(top?`Das war's! Gewinner des Abends: ${top.n}, mit ${top.s} Euro. Du darfst morgen das Statusmeeting moderieren. Herzlichen Glückwunsch.`:'Das war Kein Plan, Herr Berater. Gute Nacht.');return}
  if(s.k==='ddi'){G.ph='intro';hRender();hPub();say(DD.i,true).then(()=>{if(cur()===s)next()});return}
  if(s.k==='dde'){G.ph='rev';hRender();hPub();say('Dis oder Dat ist vorbei. Schaut auf eure Kontostände. Manche von euch sollten über einen Jobwechsel zu Nintendo nachdenken.');return}
  if(s.k==='dd'){say(s.t);ask(6);return}
  G.ph='read';hRender();hPub();
  say(s.i+' '+s.q,true).then(()=>{if(cur()===s&&G.ph==='read')ask(16)});
}
function ask(sec){
  G.ph='q';G.ans={};G.t0=Date.now();G.dur=sec*1000;G.left=sec;hRender();hPub();beep(880,.12);
  tick=setInterval(()=>{const l=Math.max(0,Math.ceil((G.t0+G.dur-Date.now())/1000));const w=Math.max(0,1-(Date.now()-G.t0)/G.dur)*100;const b=$('#tline');if(b){b.firstChild.style.width=w+'%';b.classList.toggle('low',l<=3)}
    if(l!==G.left){G.left=l;if(l<=3&&l>0)beep(440,.06);hPub()}if(l<=0)hReveal()},200);
  hCollect();
}
function hReveal(){
  if(G.ph!=='q')return;clearInterval(tick);G.ph='rev';const s=cur();
  for(const k in G.scores){const a=G.ans[k];if(!a){G.last[k]=null;continue}
    const ok=a.a===s.c;let d;
    if(s.k==='dd')d=ok?500:-500;else d=ok?Math.round(s.val*(.5+.5*Math.max(0,1-a.t/G.dur))/100)*100:-s.val/2;
    G.scores[k].s+=d;G.last[k]=d}
  hRender();hPub();
  const any=Object.values(G.ans).some(a=>a.a===s.c);beep(any?988:196,.25);
  if(s.k==='dd'){setTimeout(()=>{if(cur()===s)next()},2400)}else say(s.r);
}
function qrSvg(txt){try{const q=qrcode(0,'M');q.addData(txt);q.make();return q.createSvgTag({cellSize:6,margin:0,scalable:true})}catch(e){return ''}}
function hRender(){
  $('#tLab').textContent=hLabel();$('#tCode').textContent=code&&G.ph!=='lobby'?'Code '+code:'';
  const s=cur(),st=$('#stage');
  if(G.ph==='lobby'){
    const ps=livePlayers();
    st.innerHTML=`<div class="marq" style="font-size:clamp(40px,6vw,96px)">Kein Plan, Herr Berater</div>
      <div class="qrbox">
        <div class="qr">${code&&netOk?qrSvg(joinUrl()):''}</div>
        <div><div class="hint">QR-Code scannen oder Code eingeben</div><div class="code">${netOk?esc(code):'…'}</div>
        <div class="hint" style="max-width:34ch;margin-top:8px">${netOk?'Schnelle richtige Antworten bringen mehr Tagessatz, falsche kosten die Hälfte.':esc(netErr||'Verbinde mit dem Vermittlungsserver …')}</div></div>
      </div>
      <div class="players">${ps.length?ps.map(p=>`<div class="pl">${esc(p.name)}</div>`).join(''):'<div class="hint">Noch niemand da.</div>'}</div>
      <div><button class="btn" id="go" style="display:inline-block;padding:20px 40px">Show starten</button> <span class="hint">&nbsp;Enter oder Leertaste = weiter</span></div>`;
  }else if(G.ph==='intro'){
    st.innerHTML=`<div class="marq big">Dis oder Dat</div><div class="qtext">Pokémon oder Big-Data-Tool?</div><div class="quip">${esc(DD.i)}</div>`;
  }else if(G.ph==='end'){
    const r=Object.values(G.scores).sort((a,b)=>b.s-a.s);
    st.innerHTML=`<div class="marq big">Endstand</div><div class="podium">${r.map((x,i)=>`<div><span>${i+1}. ${esc(x.n)}</span><span>${eur(x.s)}</span></div>`).join('')||'<div><span>Keine Handys dabei</span><span>Ehre: unbezahlbar</span></div>'}</div><div><button class="btn" id="again" style="display:inline-block;padding:18px 36px">Neue Show</button></div>`;
  }else if(s.k==='dde'){
    st.innerHTML=`<div class="marq big">Dis oder Dat: vorbei</div><div class="quip">Manche von euch sollten über einen Jobwechsel zu Nintendo nachdenken.</div><div><button class="btn" id="go" style="display:inline-block;padding:18px 36px">Weiter</button></div>`;
  }else{
    const rev=G.ph==='rev',chose=i=>Object.entries(G.ans).filter(([k,a])=>a.a===i).map(([k])=>esc(G.scores[k]?G.scores[k].n:k)).join(', ');
    const cards=s.a.map((t,i)=>`<div class="an ${rev?(i===s.c?'ok':'no'):''}"><span class="l" style="background:${ACOL[i]}">${LET[i]}</span><span>${esc(t)}${rev?`<span class="who">${chose(i)||'&nbsp;'}</span>`:''}</span></div>`).join('');
    const cnt=Object.keys(G.ans).length,tot=livePlayers().length;
    if(s.k==='dd'){
      st.innerHTML=`<div class="meta"><span class="pill">Dis oder Dat ${s.n}/${s.of}</span><span>Pokémon oder Big-Data-Tool?</span></div>
        <div class="tbarline" id="tline"><i></i></div><div class="item">${esc(s.t)}</div><div class="dd">${cards}</div>`;
    }else{
      st.innerHTML=`<div class="meta"><span class="pill">${esc(hLabel())}</span>${G.ph==='q'?`<span id="cnt">${cnt} von ${tot} haben geantwortet</span>`:''}</div>
        ${G.ph!=='read'&&!rev?'<div class="tbarline" id="tline"><i></i></div>':''}
        <div class="qtext">${esc(s.q)}</div><div class="ans">${cards}</div>
        ${G.ph==='read'?`<div class="quip">${esc(s.i)}</div>`:''}
        ${rev?`<div style="display:flex;gap:2vw;align-items:center;flex-wrap:wrap"><div class="quip" style="flex:1 1 420px">${esc(s.r)}</div><button class="btn" id="go" style="flex:none;padding:18px 32px">${G.step+1<G.plan.length?'Nächste Frage':'Zum Endstand'}</button></div>`:''}`;
    }
  }
  const go=$('#go');if(go)go.onclick=next;const ag=$('#again');if(ag)ag.onclick=()=>{hush();hostInit()};
  hScore();
}
function hScore(){
  if(!G)return;const r=Object.entries(G.scores).sort((a,b)=>b[1].s-a[1].s);
  $('#sbar').innerHTML=r.map(([k,x])=>{const d=G.last[k];return `<div class="sc ${G.ph==='q'&&G.ans[k]?'done':''}"><b>${esc(x.n)}</b><span>${eur(x.s)}</span>${G.ph==='rev'&&d!=null?`<em class="${d>=0?'pos':'neg'}">${d>=0?'+':''}${eur(d)}</em>`:''}</div>`}).join('')||'<span class="hint">Punktestand erscheint, sobald Handys verbunden sind.</span>';
  const m=$('#cnt');if(m)m.textContent=`${Object.keys(G.ans).length} von ${livePlayers().length} haben geantwortet`;
}
document.addEventListener('keydown',e=>{if(mode!=='host')return;if(e.key==='Enter'||e.key===' '){const b=$('#go')||$('#again');if(b){e.preventDefault();b.click()}}});

/* ========== SPIELER ========== */
let me=ls.get('kp-name')||'',showCode='',joined=false,host=null,myR=null,myA=null,pPeer=null,pConn=null,pState='',retryT=null;
function startPlayer(c){mode='player';showCode=c;$('#pick').hidden=true;$('#ph').classList.add('on');pRender()}
function pConnect(){
  clearTimeout(retryT);
  if(!hasPeer){pState='Die Verbindungsbibliothek konnte nicht geladen werden. Seite neu laden.';return pRender()}
  if(!pPeer||pPeer.destroyed){
    pPeer=new Peer({debug:0});
    pPeer.on('open',()=>dial());
    pPeer.on('disconnected',()=>{setTimeout(()=>{try{pPeer.reconnect()}catch(e){}},1000)});
    pPeer.on('error',e=>{if(e.type==='peer-unavailable'){pState='Show '+showCode+' nicht gefunden. Läuft der große Bildschirm? Ich versuche es weiter.';pRender();retryT=setTimeout(dial,2500)}else{pState='Verbindung hakt, ich versuche es weiter.';pRender();retryT=setTimeout(dial,3000)}});
  }else dial();
}
function dial(){
  clearTimeout(retryT);if(!pPeer||!pPeer.open){retryT=setTimeout(dial,1500);return}
  try{pConn&&pConn.close()}catch(e){}
  pState='Verbinde mit Show '+showCode+' …';pRender();
  const c=pPeer.connect(PFX+showCode,{reliable:true});pConn=c;
  c.on('open',()=>{if(pConn!==c)return;pState='';c.send({t:'hi',name:me});if(host&&myA!=null)c.send({t:'ans',r:host.r,a:myA});pRender()});
  c.on('data',d=>{if(pConn!==c||!d||d.role!=='host')return;host=d;if(host.r!==myR){myR=host.r;myA=null}pRender()});
  c.on('close',()=>{if(pConn!==c)return;pState='Verbindung verloren, verbinde neu …';pRender();retryT=setTimeout(dial,1500)});
}
function myScore(){if(!host||!Array.isArray(host.sc))return null;const i=host.sc.findIndex(x=>key(x[0])===key(me));return i<0?null:{rank:i+1,s:host.sc[i][1],d:host.sc[i][2],of:host.sc.length}}
function pAnswer(i){if(!host||host.ph!=='q'||myA!=null)return;myA=i;try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}try{pConn&&pConn.open&&pConn.send({t:'ans',r:host.r,a:i})}catch(e){}pRender()}
function pRender(){
  const b=$('#pBody'),m=myScore();$('#pMe').textContent=joined?(me+(m?' · '+eur(m.s):'')):'';
  if(!joined){
    b.innerHTML=`<div class="state">Wie heißt du?</div><p class="muted">Dein Name erscheint auf dem großen Bildschirm.</p>
      <form id="jf"><input id="nm" maxlength="20" autocomplete="off" value="${esc(me)}" placeholder="Vorname" aria-label="Name">
      ${showCode?`<p class="muted">Show-Code: <b class="mini">${esc(showCode)}</b></p>`:'<input id="cd" maxlength="6" autocomplete="off" placeholder="Show-Code vom Fernseher" aria-label="Show-Code" style="margin-top:12px;text-transform:uppercase">'}
      <button class="btn" style="margin-top:14px;width:100%">Rein in die Show</button></form>`;
    $('#jf').onsubmit=e=>{e.preventDefault();const v=$('#nm').value.trim();const cd=$('#cd');if(cd)showCode=cd.value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(!v||!showCode)return;me=v.slice(0,20);ls.set('kp-name',me);joined=true;keepAwake();try{history.replaceState(null,'','#'+showCode)}catch(x){}pConnect();pRender()};return;
  }
  if(pState&&!host){b.innerHTML=`<div class="state">Moment …</div><p class="muted">${esc(pState)}</p>`;return}
  if(!host){b.innerHTML=`<div class="state">Du bist drin, ${esc(me)}.</div><p class="muted">Warte auf den großen Bildschirm.</p>`;return}
  const warn=pState?`<p class="warn">${esc(pState)}</p>`:'';
  const ph=host.ph,a=Array.isArray(host.a)?host.a:[];
  if(ph==='lobby'){b.innerHTML=`<div class="state">Du bist drin, ${esc(me)}.</div><p class="muted">Gleich geht's los. Schnell und richtig bringt am meisten.</p>${warn}`;return}
  if(ph==='end'){b.innerHTML=`<div class="state">${m?`Platz ${m.rank} von ${m.of}`:'Show vorbei'}</div><p class="ptimer">${m?eur(m.s):''}</p><p class="muted">Danke fürs Mitspielen.</p>`;return}
  if(ph==='intro'){b.innerHTML=`<div class="state">Dis oder Dat!</div><p class="muted">Pokémon oder Big-Data-Tool? Sechs Sekunden pro Name.</p>${warn}`;return}
  if(ph==='read'){b.innerHTML=`<p class="muted">${esc(host.lab)}</p><div class="state" style="font-size:24px">${esc(host.t)}</div><p class="muted">Hör zu, gleich darfst du drücken.</p>${warn}`;return}
  if(ph==='q'){
    if(myA!=null){b.innerHTML=`<div class="state">Antwort ${host.k==='dd'?esc(a[myA]):LET[myA]} ist eingeloggt.</div><p class="muted">Kein Zurück. Wie im echten Projekt.</p>${warn}`;return}
    b.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><span class="muted">${esc(host.lab)}</span><span class="ptimer">${host.left|0}</span></div>
      ${host.k==='dd'?`<div class="state" style="text-align:center">${esc(host.t)}</div>`:''}
      <div class="buzz">${a.map((t,i)=>`<button class="bz ${host.k==='dd'?'dd2':''}" data-i="${i}" style="background:${ACOL[i]}">${host.k==='dd'?'':`<span class="l">${LET[i]}</span>`}<span>${esc(t)}</span></button>`).join('')}</div>${warn}`;
    b.querySelectorAll('.bz').forEach(x=>x.onclick=()=>pAnswer(+x.dataset.i));return;
  }
  if(ph==='rev'){
    if(host.c==null){b.innerHTML=`<div class="state">Zwischenstand</div><p class="ptimer">${m?eur(m.s):''}</p><p class="muted">${m?`Platz ${m.rank} von ${m.of}`:''}</p>`;return}
    const d=m?m.d:null;
    b.innerHTML=`<div class="state">${d==null?'Keine Antwort':d>0?'Richtig!':'Leider falsch'}</div>
      <p class="ptimer" style="color:${d==null?'var(--soft)':d>0?'var(--a3)':'var(--a2)'}">${d==null?'0 €':(d>0?'+':'')+eur(d)}</p>
      <p class="muted">Richtig war ${host.k==='dd'?'':LET[host.c]+': '}${esc(a[host.c])}</p><p>Kontostand: <b>${m?eur(m.s):'0 €'}</b>${m?` · Platz ${m.rank} von ${m.of}`:''}</p>`;
  }
}
if(hashCode)startPlayer(hashCode);
}
</script>
</body>
</html>
