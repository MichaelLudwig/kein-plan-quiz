<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Kein Plan, Herr Berater</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
/* VOICE: Kioptra-Abend: präzise, technisch, mit einem Augenzwinkern
   IDEA: ein ruhiges TV-Studio im Kioptra-Look: Raster, Monospace-Labels, goldene Akzente, Licht von oben
   PICTURE: Frage groß auf dunklem Raster, vier Antwortkacheln mit Farbcode, Countdown-Ring in Gold, Podest am Ende
   COLOUR and TYPE: Kioptra-Navy, Gold #e3b54a, Teal, Blau, Lavendel; IBM Plex Sans und IBM Plex Mono
   LAYOUT: TV: Kopfzeile mit Logo, Bühne, Punkteleiste; Handy: eine Spalte, große Buzzer
   MOTION: nichts blinkt dauerhaft. Bewegung nur kurz bei Ereignissen, Lichtkegel schwenken langsam */
:root{color-scheme:dark;--bg:#0a1422;--panel:#0f1c2e;--panel2:#14263d;--line:rgba(127,166,216,.16);--line2:rgba(127,166,216,.3);--y:#e3b54a;--y2:#f3d488;--ink:#eef3fb;--soft:#aeb9c9;--a0:#e3b54a;--a1:#33c7a6;--a2:#5c9bd6;--a3:#8e84d8;--dark:#0a1422;--bad:#ff7a6b;--red:#e3b54a;--ease:cubic-bezier(.2,.8,.2,1)}
*{box-sizing:border-box;min-width:0}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font:17px/1.5 'IBM Plex Sans',system-ui,sans-serif;overflow-x:clip;-webkit-tap-highlight-color:transparent;background-image:radial-gradient(70% 50% at 50% 0%,rgba(63,118,189,.22),transparent 70%),linear-gradient(rgba(127,166,216,.07) 1px,transparent 1px),linear-gradient(90deg,rgba(127,166,216,.07) 1px,transparent 1px);background-size:100% 100%,48px 48px,48px 48px}
button{font:inherit}
.marq{font-family:'IBM Plex Sans',sans-serif;font-weight:700;line-height:1.05;color:var(--ink);letter-spacing:-.01em}
.marq em{font-style:normal;color:var(--y)}
.mono{font-family:'IBM Plex Mono',monospace}
.logo{display:inline-flex;align-items:center;gap:10px}
.logo svg{height:28px;width:auto;flex:none}
.wrap{max-width:560px;margin:0 auto;padding:22px 16px 40px}
.btn{all:unset;cursor:pointer;display:block;text-align:center;background:linear-gradient(180deg,var(--y2),var(--y) 55%);color:var(--dark);font:700 19px/1 'IBM Plex Sans',sans-serif;padding:18px 22px;border-radius:3px;letter-spacing:.02em;box-shadow:0 8px 26px rgba(227,181,74,.18)}
.btn:hover{filter:brightness(1.08)}.btn:active{transform:translateY(2px)}
.btn:focus-visible{outline:2px solid var(--ink);outline-offset:3px}
.btn.ghost{background:transparent;color:var(--ink);border:1px solid var(--line2);font-size:16px;box-shadow:none}
input{width:100%;font:600 21px 'IBM Plex Sans',sans-serif;padding:15px;border-radius:3px;border:1px solid var(--y);background:var(--panel);color:var(--ink)}
input:focus-visible{outline:2px solid var(--y)}
.muted{color:var(--soft);font-size:15px}
.warn{background:rgba(227,181,74,.1);border:1px solid rgba(227,181,74,.4);border-radius:3px;padding:12px 14px;font-size:15px;margin-top:16px}
#pick .marq{font-size:clamp(38px,10vw,68px);margin:22px 0 12px;text-wrap:balance}
#pick .roles{display:grid;gap:14px;margin-top:26px}
.role{all:unset;cursor:pointer;display:block;background:var(--panel);border:1px solid var(--line);border-left:3px solid var(--y);border-radius:3px;padding:18px 20px}
.role:focus-visible{outline:2px solid var(--y);outline-offset:3px}
.role b{display:block;font:700 22px/1.2 'IBM Plex Sans',sans-serif}
.role span{color:var(--soft);font-size:15px}
.role.alt{border-left-color:var(--a1)}

/* ---------- TV: Rahmen ---------- */
#tv{display:none;min-height:100vh;flex-direction:column;position:relative;z-index:1}
#tv.on{display:flex}
#tv::before,#tv::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none}
#tv::before{background:radial-gradient(120% 95% at 50% 42%,transparent 52%,rgba(3,8,16,.72))}
#tv::after{background:radial-gradient(62% 44% at 50% 0%,rgba(227,181,74,.15),transparent 72%);opacity:.45;transition:opacity .9s ease}
body[data-ph=read] #tv::after{opacity:.6}body[data-ph=q] #tv::after{opacity:.3}
body[data-ph=rev] #tv::after,body[data-ph=board] #tv::after{opacity:.85}body[data-ph=end] #tv::after{opacity:1}
.tbar{display:flex;align-items:center;gap:16px;padding:14px 3vw;border-bottom:1px solid var(--line);background:rgba(10,20,34,.75);box-shadow:0 1px 0 rgba(227,181,74,.1)}
.tbar .marq{font-size:clamp(15px,1.5vw,20px);font-weight:600}
.tbar .lab{margin-left:auto;font:500 clamp(13px,1.3vw,18px) 'IBM Plex Mono',monospace;color:var(--soft)}
.ibtn{all:unset;cursor:pointer;font:500 14px 'IBM Plex Mono',monospace;padding:8px 12px;border-radius:3px;border:1px solid var(--line);color:var(--soft);white-space:nowrap}
.ibtn:hover{border-color:var(--line2);color:var(--ink)}
.ibtn:focus-visible{outline:2px solid var(--y)}
.ibtn.on{border-color:var(--y);color:var(--y)}
select.ibtn{all:revert;font:500 14px 'IBM Plex Mono',monospace;padding:8px 10px;border-radius:3px;border:1px solid var(--line);background:var(--panel);color:var(--ink);max-width:min(340px,40vw)}
.stagebox{flex:1;display:flex;flex-direction:column;justify-content:center;padding:2.4vh 4.6vw 2.4vh;gap:1.8vh;position:relative}
.stagebox.qa{justify-content:flex-start;padding-top:clamp(24px,5vh,84px)}
.frame{position:absolute;inset:1vh 1.5vw;pointer-events:none;border:1px solid rgba(227,181,74,.14);border-radius:4px;--c:rgba(227,181,74,.75);background:
  linear-gradient(var(--c),var(--c)) 0 0/26px 2px,linear-gradient(var(--c),var(--c)) 0 0/2px 26px,
  linear-gradient(var(--c),var(--c)) 100% 0/26px 2px,linear-gradient(var(--c),var(--c)) 100% 0/2px 26px,
  linear-gradient(var(--c),var(--c)) 0 100%/26px 2px,linear-gradient(var(--c),var(--c)) 0 100%/2px 26px,
  linear-gradient(var(--c),var(--c)) 100% 100%/26px 2px,linear-gradient(var(--c),var(--c)) 100% 100%/2px 26px;background-repeat:no-repeat}
.meta{display:flex;gap:18px;align-items:center;flex-wrap:wrap;font:500 clamp(13px,1.3vw,19px) 'IBM Plex Mono',monospace;color:var(--soft)}
.pill{background:rgba(227,181,74,.08);color:var(--y);border:1px solid var(--y);padding:5px 12px;border-radius:2px;white-space:nowrap}
.prog{display:flex;gap:3px;align-items:flex-end;height:12px}
.prog i{width:clamp(7px,.9vw,15px);height:5px;background:rgba(127,166,216,.2);border-radius:1px}
.prog i.t2{height:8px}.prog i.t3{height:11px}
.prog i.d{background:rgba(227,181,74,.5)}
.prog i.c{background:var(--y2);box-shadow:0 0 10px rgba(227,181,74,.9)}
.hint{font:500 clamp(13px,1.2vw,18px) 'IBM Plex Mono',monospace;color:var(--soft)}
.auto{font:500 14px 'IBM Plex Mono',monospace;color:var(--soft)}
.big{font-size:clamp(44px,7vw,116px)}
.h2{font-size:clamp(28px,3.6vw,58px)}

/* Großer Bildschirm: alles bleibt im Bild, die Bühne wird bei Bedarf per fit() verkleinert. Kleine Displays scrollen */
@media(min-width:900px) and (min-height:540px){#tv:not(.tall){height:100vh;height:100dvh;min-height:0}#tv:not(.tall) .stagebox{min-height:0;overflow:hidden}}
.stagebox.measure *{animation:none!important}
/* ---------- TV: Frage und Antworten ---------- */
.tbarline{height:5px;background:var(--line);overflow:hidden;border-radius:1px}
.qa .tbarline{margin-right:calc(clamp(84px,9.5vw,150px) + 2vw)}
.tbarline i{display:block;height:100%;width:100%;background:linear-gradient(90deg,var(--y),var(--y2));transform-origin:0 50%}
.tbarline.low i{background:var(--bad)}
.qtext{font:600 clamp(22px,min(3.3vw,5.7vh),58px)/1.18 'IBM Plex Sans',sans-serif;text-wrap:balance;max-width:34ch;text-shadow:0 2px 24px rgba(3,8,16,.8)}
.ans{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:clamp(10px,1.3vw,22px)}
.an{--c:var(--y);position:relative;display:flex;gap:clamp(12px,1.3vw,22px);align-items:center;overflow:hidden;background:linear-gradient(180deg,rgba(23,42,68,.93),rgba(13,25,42,.93));border:1px solid var(--line2);border-radius:4px;padding:clamp(10px,min(1.4vw,2.2vh),24px);padding-left:clamp(16px,1.7vw,30px);font:600 clamp(16px,min(2vw,3.5vh),32px)/1.25 'IBM Plex Sans',sans-serif;box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 28px rgba(0,0,0,.3)}
.an::before{content:"";position:absolute;left:0;top:0;bottom:0;width:5px;background:var(--c)}
.an .l{flex:none;width:1.9em;height:1.9em;border-radius:3px;display:grid;place-items:center;color:var(--dark);background:var(--c);font:700 1em 'IBM Plex Mono',monospace;box-shadow:inset 0 -3px 0 rgba(0,0,0,.18)}
.an .tx{flex:1}
.an .who{display:block;font:500 clamp(12px,1vw,17px)/1.3 'IBM Plex Mono',monospace;color:var(--soft);margin-top:4px;min-height:1.3em}
.an .tick{flex:none;width:1.7em;height:1.7em;border-radius:50%;display:grid;place-items:center;background:var(--y);color:var(--dark);font:700 .9em 'IBM Plex Mono',monospace}
.an.no{opacity:.4}
.an.ok{border-color:var(--y);background:linear-gradient(180deg,rgba(58,56,48,.96),rgba(24,36,52,.96));box-shadow:0 0 0 1px var(--y),0 0 46px rgba(227,181,74,.3),inset 0 1px 0 rgba(255,255,255,.1)}
.an.ok::after{content:"";position:absolute;top:0;bottom:0;left:0;width:34%;background:linear-gradient(100deg,transparent,rgba(255,236,180,.26),transparent);transform:translateX(-120%)}
.an.ok .who{color:var(--y2)}
.dd{display:grid;grid-template-columns:1fr 1fr;gap:2vw;margin-top:1vh}
.dd .an{justify-content:center;text-align:center;font-size:clamp(20px,2.8vw,44px);padding-block:clamp(14px,2.6vh,34px)}
.dd .an .tx{flex:none}
.item{font:700 clamp(44px,min(9vw,16vh),140px)/1 'IBM Plex Sans',sans-serif;text-align:center;letter-spacing:-.02em;color:var(--y);text-shadow:0 0 50px rgba(227,181,74,.28)}
.slot{display:flex;gap:2vw;align-items:center;flex-wrap:wrap;min-height:clamp(74px,12vh,130px)}
.slot .quip{flex:1 1 420px}
.gobox{flex:none;display:grid;gap:6px;justify-items:center}
.quip{background:rgba(20,38,61,.9);color:var(--ink);border:1px solid var(--line);border-left:3px solid var(--y);border-radius:3px;padding:12px 20px;font:500 clamp(15px,min(1.6vw,3vh),25px)/1.35 'IBM Plex Sans',sans-serif;max-width:62ch;position:relative}
.quip::before{content:"// Kevin vom Helpdesk";display:block;font:500 13px 'IBM Plex Mono',monospace;color:var(--y);margin-bottom:3px}
.ring{position:absolute;right:4.6vw;top:3.2vh;width:clamp(84px,9.5vw,150px);aspect-ratio:1;z-index:3}
.ring::before{content:"";position:absolute;inset:8%;border-radius:50%;background:rgba(8,16,28,.88);box-shadow:0 0 34px rgba(227,181,74,.16)}
.ring svg{position:relative;width:100%;height:100%;transform:rotate(-90deg)}
.ring circle{fill:none}
.ring .bg{stroke:rgba(127,166,216,.16);stroke-width:7}
.ring .tk{stroke:rgba(127,166,216,.4);stroke-width:2.5;stroke-dasharray:.8 14.908}
.ring .fg{stroke:var(--y);stroke-width:7;stroke-dasharray:276.46;stroke-dashoffset:0}
.ring b{position:absolute;inset:0;display:grid;place-items:center;font:700 clamp(28px,3.3vw,52px) 'IBM Plex Mono',monospace;color:var(--ink);font-variant-numeric:tabular-nums}
.ring.low .fg{stroke:var(--bad)}.ring.low b{color:var(--bad)}

/* ---------- TV: Lobby ---------- */
.lgrid{display:grid;grid-template-columns:auto minmax(0,1fr);gap:clamp(20px,3.4vw,64px);align-items:start}
.ljoin{display:grid;gap:12px;justify-items:start}
.lside{display:grid;gap:clamp(8px,1.5vh,16px)}
.qr{background:#eef3fb;padding:12px;border-radius:4px;width:clamp(170px,min(21vw,34vh),300px);aspect-ratio:1;box-shadow:0 0 0 1px rgba(227,181,74,.5),0 18px 50px rgba(0,0,0,.4)}
.qr svg{width:100%;height:100%;display:block}
.code{font:600 clamp(40px,5.4vw,92px)/1 'IBM Plex Mono',monospace;color:var(--y);letter-spacing:.08em;text-shadow:0 0 40px rgba(227,181,74,.3)}
.mini{font-family:'IBM Plex Mono',monospace;color:var(--y);font-size:clamp(14px,1.4vw,20px)}
.players{display:flex;flex-wrap:wrap;gap:8px}
.pl{background:rgba(15,28,46,.86);border:1px solid var(--line2);border-radius:3px;padding:6px 14px;font:600 clamp(15px,1.5vw,22px) 'IBM Plex Sans',sans-serif}
.rounds{display:grid;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px;max-width:1300px}
.rnd{all:unset;cursor:pointer;display:grid;gap:2px;background:rgba(15,28,46,.86);border:1px solid var(--line);border-left:4px solid var(--a1);border-radius:3px;padding:10px 14px}
.rnd b{font:700 clamp(15px,1.4vw,21px)/1.2 'IBM Plex Sans',sans-serif}
.rnd span{font:500 13px 'IBM Plex Mono',monospace;color:var(--soft)}
.rnd em{font:600 13px 'IBM Plex Mono',monospace;font-style:normal;color:var(--a1)}
.rnd.done{border-left-color:var(--soft);opacity:.7}.rnd.done em{color:var(--soft)}
.rnd.on{border-color:var(--y);border-left-color:var(--y);opacity:1;box-shadow:0 0 0 1px var(--y),0 0 30px rgba(227,181,74,.2)}
.rnd:focus-visible{outline:2px solid var(--y)}
.vtag{font:600 12px 'IBM Plex Mono',monospace;padding:3px 8px;border-radius:2px;border:1px solid var(--a1);color:var(--a1);text-transform:uppercase;letter-spacing:.06em}
.vtag.net{border-color:var(--y);color:var(--y)}
.small{font-size:clamp(12px,1vw,15px)}

/* ---------- TV: Zwischenstand und Endstand ---------- */
.board{display:grid;gap:8px;max-width:1500px}
.board.c2{grid-auto-flow:column;grid-template-rows:repeat(var(--rows),auto);grid-template-columns:1fr 1fr;column-gap:16px;max-width:none}
.brow{display:grid;grid-template-columns:2.2em minmax(5em,13em) 1fr auto 6.4em;gap:16px;align-items:center;background:linear-gradient(180deg,rgba(21,39,63,.93),rgba(13,25,42,.93));border:1px solid var(--line);border-radius:3px;padding:clamp(6px,1.1vh,14px) 18px;font:600 clamp(16px,min(2vw,3.4vh),32px) 'IBM Plex Sans',sans-serif;box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.board.c2 .brow{font-size:clamp(14px,min(1.5vw,2.6vh),24px);grid-template-columns:2em minmax(4em,9em) 1fr auto 5.6em;gap:10px;padding-inline:12px}
.brow.lead{border-color:var(--y);box-shadow:0 0 30px rgba(227,181,74,.18),inset 0 1px 0 rgba(255,255,255,.08)}
.board.pre .brow.lead{border-color:var(--line);box-shadow:inset 0 1px 0 rgba(255,255,255,.05)}
.board.pre .bname i{visibility:hidden}
.bpos{font:700 1.1em 'IBM Plex Mono',monospace;color:var(--y)}
.bname{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bname i{font-style:normal;font:600 .6em 'IBM Plex Mono',monospace;margin-left:10px}
.up{color:var(--a1)}.dn{color:var(--bad)}
.bbar{height:.5em;background:rgba(127,166,216,.12);border-radius:1px;overflow:hidden}
.bbar i{display:block;height:100%;background:linear-gradient(90deg,var(--y),var(--y2));transition:width .9s var(--ease)}
.bbar i.m{background:var(--bad)}
.bval{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}
.bd{font:600 .7em 'IBM Plex Mono',monospace;text-align:right;white-space:nowrap;color:var(--soft)}
.pos{color:var(--a1)}.neg{color:var(--bad)}
.podium{display:grid;gap:8px;max-width:900px}
.podium div{display:flex;justify-content:space-between;background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:12px 22px;font:600 clamp(19px,2.2vw,34px) 'IBM Plex Sans',sans-serif}
.pod{display:flex;align-items:flex-end;justify-content:center;gap:clamp(8px,1.2vw,20px);height:min(36vh,360px);max-width:1100px;width:100%;margin:0 auto}
.pcol{flex:1 1 0;max-width:340px;height:100%;display:flex;flex-direction:column;justify-content:flex-end;text-align:center}
.pinfo{display:grid;gap:2px;padding:0 6px 10px}
.pname{font:700 clamp(18px,2.2vw,36px)/1.15 'IBM Plex Sans',sans-serif;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pamt{font:600 clamp(14px,1.5vw,24px) 'IBM Plex Mono',monospace;color:var(--soft);font-variant-numeric:tabular-nums}
.pstep{height:var(--h);min-height:44px;display:grid;place-items:center;background:linear-gradient(180deg,rgba(30,52,82,.95),rgba(13,25,42,.9));border:1px solid var(--line2);border-top:3px solid var(--soft);border-radius:3px 3px 0 0;transform-origin:50% 100%}
.pstep b{font:700 clamp(26px,3.4vw,60px)/1 'IBM Plex Mono',monospace;color:var(--soft)}
.p2 .pstep b{font-size:clamp(22px,2.8vw,48px)}.p3 .pstep b{font-size:clamp(18px,2.1vw,36px)}
.p1{--h:62%}.p2{--h:42%}.p3{--h:27%}
.p1 .pname{color:var(--y);font-size:clamp(22px,2.9vw,48px)}.p1 .pamt{color:var(--ink)}
.p1 .pstep{border-top-color:var(--y);background:linear-gradient(180deg,rgba(84,72,40,.95),rgba(20,34,52,.92));box-shadow:0 0 60px rgba(227,181,74,.22)}
.p1 .pstep b{color:var(--y)}
.rest{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.rest span{background:rgba(15,28,46,.86);border:1px solid var(--line);border-radius:3px;padding:5px 12px;font:600 clamp(14px,1.3vw,20px) 'IBM Plex Sans',sans-serif;white-space:nowrap}
.rest b{font-family:'IBM Plex Mono',monospace;color:var(--y)}.rest em{font-style:normal;font-family:'IBM Plex Mono',monospace;color:var(--soft);margin-left:6px}
.endrow{display:flex;gap:12px;flex-wrap:wrap;align-items:center;justify-content:center}

/* ---------- TV: Punkteleiste ---------- */
.sbar{display:flex;gap:10px;padding:10px 3vw 14px;overflow-x:auto;border-top:1px solid var(--line);background:rgba(10,20,34,.85)}
.sc{flex:none;background:rgba(15,28,46,.86);border:1px solid var(--line);border-radius:3px;padding:7px 14px;min-width:120px;transition:border-color .25s}
.sc b{display:block;font:500 13px 'IBM Plex Mono',monospace;color:var(--soft);white-space:nowrap}
.sc span{font:700 22px 'IBM Plex Sans',sans-serif;white-space:nowrap;font-variant-numeric:tabular-nums}
.sc em{font-style:normal;font:600 13px 'IBM Plex Mono',monospace;margin-left:6px}
.sc.lead{border-color:rgba(227,181,74,.55);background:var(--panel2)}
.sc.done{border-color:var(--a1)}
.sc.done b::after{content:" ✓";color:var(--a1)}
.sc b{overflow:hidden;text-overflow:ellipsis}
.sbar.many{gap:6px;flex-wrap:wrap;overflow:visible;padding-block:8px 10px}
.sbar.many .sc{flex:1 1 86px;min-width:86px;max-width:170px;padding:4px 9px}
.sbar.many .sc span{font-size:17px}.sbar.many .sc b{font-size:12px}
.sbar.many .sc em{display:none}.sbar.many .sc.won span{color:var(--a1)}.sbar.many .sc.lost span{color:var(--bad)}

/* ---------- Effekte: Lichtkegel als Compositor-Ebenen, WebGL-Leinwand ---------- */
body.fxon{background:var(--bg);background-image:none}
#fx{position:fixed;inset:0;width:100vw;height:100vh;z-index:0;pointer-events:none}
#beams{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.beam{opacity:.6;position:absolute;top:-8vh;width:90vh;height:128vh;margin-left:-45vh;transform-origin:50% 0;will-change:transform;background:conic-gradient(from 169deg at 50% 0%,transparent 0deg,rgba(var(--c),.3) 7deg,rgba(var(--c),.42) 11deg,rgba(var(--c),.3) 15deg,transparent 22deg,transparent 360deg);-webkit-mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.55) 45%,transparent 94%);mask-image:linear-gradient(180deg,#000 0%,rgba(0,0,0,.55) 45%,transparent 94%)}
body.fxon .tbar,body.fxon .sbar,body.beamon .tbar,body.beamon .sbar{background:rgba(10,20,34,.92)}

/* ---------- Auftritte: nur beim Phasenwechsel, nichts läuft in Schleife ---------- */
@keyframes rise{from{opacity:0;transform:translateY(26px) scale(.97)}to{opacity:1;transform:none}}
@keyframes fade{from{opacity:0}to{opacity:1}}
@keyframes dim{from{opacity:1}to{opacity:.4}}
@keyframes okin{0%{border-color:var(--line2);background:linear-gradient(180deg,rgba(23,42,68,.93),rgba(13,25,42,.93));box-shadow:inset 0 1px 0 rgba(255,255,255,.06),0 10px 28px rgba(0,0,0,.3);transform:none}55%{transform:scale(1.045)}100%{transform:scale(1.015)}}
@keyframes sweep{from{transform:translateX(-120%)}to{transform:translateX(420%)}}
@keyframes grow{from{transform:scaleY(0)}to{transform:scaleY(1)}}
@keyframes splash{0%{opacity:0;transform:scale(1.6)}18%{opacity:1;transform:scale(1)}72%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.86)}}
.stagebox.fresh .qtext,.stagebox.fresh .marq,.stagebox.fresh .item{animation:rise .55s var(--ease) var(--d,0s) both}
.stagebox.fresh .an{animation:rise .5s var(--ease) calc(var(--d,0s) + var(--i,0)*.08s) both}
.stagebox.fresh .quip,.stagebox.fresh .podium div{animation:rise .5s var(--ease) calc(var(--d,0s) + .25s) both}
.stagebox.sp{--d:1.25s}   /* solange die Einblendung "Frage N" steht, kommen Frage und Kacheln erst danach */
/* Frage und Kacheln stehen schon: beim Wechsel zu Countdown und Auflösung nicht noch einmal einfliegen */
.stagebox.fresh.stay .qtext,.stagebox.fresh.stay .item,.stagebox.fresh.stay .an:not(.ok):not(.no){animation:none}
.stagebox.fresh .item{animation-duration:.3s}
.stagebox.fresh .brow{animation:fade .4s ease both}
.quip.swap{animation:fade .45s ease both}
.stagebox.fresh .ans .an.no{animation:dim .5s ease .45s both}
.stagebox.fresh .ans .an.ok{animation:okin .7s var(--ease) .45s both}
.stagebox.fresh .ans .an.ok::after{animation:sweep 1s ease-out .6s both}
.stagebox.fresh .ans .who,.stagebox.fresh .ans .tick{animation:fade .4s ease .6s both}
.stagebox.fresh .dd .an.no,.stagebox.fresh .dd .an.ok{animation:none}
.stagebox.fresh .dd .an.ok::after{animation:sweep .8s ease-out both}
.stagebox.fresh .pstep{animation:grow .9s var(--ease) both}
.stagebox.fresh .pinfo{animation:rise .6s var(--ease) both}
.stagebox.fresh .p3 .pstep{animation-delay:.2s}.stagebox.fresh .p3 .pinfo{animation-delay:.7s}
.stagebox.fresh .p2 .pstep{animation-delay:.8s}.stagebox.fresh .p2 .pinfo{animation-delay:1.3s}
.stagebox.fresh .p1 .pstep{animation-delay:1.5s}.stagebox.fresh .p1 .pinfo{animation-delay:2.1s}
.stagebox.fresh .rest,.stagebox.fresh .endrow{animation:fade .6s ease 2.4s both}
.stagebox.fresh .pod~.quip{animation:fade .6s ease 2.6s both}
.splash{position:absolute;inset:0;display:grid;place-items:center;pointer-events:none;z-index:5}
.splash div{text-align:center;animation:splash 1.8s var(--ease) both}
.splash b{display:block;font:700 clamp(64px,10vw,180px)/1 'IBM Plex Sans',sans-serif;color:var(--y);text-shadow:0 0 40px rgba(227,181,74,.5);letter-spacing:-.02em}

  }
  const vs=$('#vsel');if(vs){vs.onchange=()=>{if(vs.value){ls.set('kp-voice',vs.value);TTS.reset();pickVoice();voiceNote()}};$('#vtest').onclick=()=>{TTS.reset();say('Willkommen bei Kein Plan, Herr Berater! Ich bin Kevin vom Helpdesk, und heute geht es um euren Tagessatz.')}}
  document.querySelectorAll('[data-set]').forEach(b=>b.onclick=()=>{G.sel=b.dataset.set;hRender()});
  const rs=$('#reset');if(rs)rs.onclick=()=>{if(G.ph==='lobby'){G.scores={};G.n=0;G.limit=20;G.restored=false;G.kick={};G.miss={};hCollect();saveState();hRender();hPub()}};
  const rr=$('#rreset');if(rr)rr.onclick=()=>{['kp-used-roast','kp-used-roast-out','kp-used-lead'].forEach(k=>{memUsed[k]=[];ls.set(k,'[]')});hRender()};
  const sh=$('#showEnd');if(sh)sh.onclick=endShow;
  const cn=$('#cont');if(cn)cn.onclick=()=>{hush();clearInterval(tick);clearTimeout(autoT);G.final=false;G.finalNext=false;G.step=-1;G.plan=[];G.ph='lobby';G.last={};G.endLine='';G.sel=defaultSel();FX.mood('lobby');saveState();hRender();hPub()};
  if(G.ph!=='lobby'&&G.ph!=='wait'){const fr=document.createElement('div');fr.className='frame';st.prepend(fr)}
  if(G.ph==='q'||G.ph==='bet'){const rg=document.createElement('div');rg.className='ring';rg.id='ring';rg.innerHTML=`<svg viewBox="0 0 100 100" aria-hidden="true"><circle class="bg" cx="50" cy="50" r="44"/><circle class="tk" cx="50" cy="50" r="49"/><circle class="fg" id="rgc" cx="50" cy="50" r="44"/></svg><b id="rgn"></b>`;st.append(rg);updTimer(G.low||3);runTimer()}
  if(fresh&&G.ph==='read'&&s&&s.k==='q'){const sp=document.createElement('div');sp.className='splash';sp.innerHTML=s.fin?'<div><b>FINALE</b><span>Alles oder nichts</span></div>':`<div><b>Frage ${s.n}</b><span>${eur(s.val)}</span></div>`;st.prepend(sp);setTimeout(()=>sp.remove(),1900);beep(330,.1);setTimeout(()=>beep(495,.18),140)}
  st.classList.toggle('fresh',fresh);st.classList.toggle('sp',!!st.querySelector('.splash'));st.classList.toggle('qa',!!s&&s.k==='q'&&(G.ph==='read'||G.ph==='q'||G.ph==='rev'));st.classList.toggle('stay',!!s&&((s.k==='q'&&(G.ph==='q'||G.ph==='rev'))||(s.k==='dd'&&G.ph==='rev')));
  fit();if(fresh&&G.ph==='board')animateBoard();
  const go=$('#go');if(go)go.onclick=()=>{const c=cur();if(G.ph==='rev'&&c&&c.k==='q'&&!c.cm)afterReveal(c);else next()};const ag=$('#again');if(ag)ag.onclick=()=>{hush();hostInit(true)};
  hScore();
}
/* Passt die Bühne nicht auf den Bildschirm (kleiner Laptop, lange Frage, viele Spieler), wird sie verkleinert, statt die Punkteleiste aus dem Bild zu schieben */
function fit(){
  const st=$('#stage'),tv=$('#tv');if(!st||mode!=='host')return;st.style.zoom='';tv.classList.remove('tall');
  if(!matchMedia('(min-width:900px) and (min-height:540px)').matches)return;   /* kleines Display (Handy als Host): normal scrollen */
  st.classList.add('measure');let z=1;
  for(let i=0;i<3;i++){const sh=st.scrollHeight,ch=st.clientHeight;if(!ch||sh<=ch+1)break;z=z*ch/sh*.985;if(z<.6){z=1;st.style.zoom='';tv.classList.add('tall');break}st.style.zoom=z}
  st.classList.remove('measure');
}
addEventListener('resize',()=>{if(mode==='host'&&G)fit()});
function hScore(){
  if(!G)return;const r=actE().sort(byScore),sb=$('#sbar');
  sb.classList.toggle('many',r.length>7);sb.innerHTML=r.map(([k,x],i)=>{const d=G.last[k];return `<div class="sc ${G.ph==='q'&&G.ans[k]?'done':''}${G.ph==='rev'&&d!=null?(d>=0?' won':' lost'):''}${r.length>1&&x.s===r[0][1].s&&x.s>r[r.length-1][1].s?' lead':''}" data-kick="${esc(k)}" title="Doppelklick: aus dem Spiel nehmen"><b>${i+1}. ${esc(x.n)}</b><span>${eur(x.s)}</span>${G.ph==='rev'&&d!=null?`<em class="${d>=0?'pos':'neg'}">${d>=0?'+':''}${eur(d)}</em>`:''}</div>`}).join('')||'<span class="hint">Punktestand erscheint, sobald Handys verbunden sind.</span>';
  sb.querySelectorAll('[data-kick]').forEach(el=>el.ondblclick=()=>{G.kick=G.kick||{};G.kick[el.dataset.kick]=true;hScore();hPub();if(G.ph==='q')hCollect()});
  const m=$('#cnt');if(m){const act=liveKeys().filter(k=>!G.kick[k]&&(G.miss[k]||0)<3);m.textContent=`${act.filter(k=>G.ans[k]).length} von ${act.length} haben geantwortet`}
}
document.addEventListener('keydown',e=>{
  if(mode!=='host'||!G||e.repeat||e.ctrlKey||e.metaKey||e.altKey)return;
  const tg=e.target&&e.target.closest?e.target:null;if(tg&&tg.closest('select,input,textarea'))return;
  const k=String(e.key||'').toLowerCase();
  if(k==='p'){$('#pause').click();return}if(k==='e'){$('#fxb').click();return}
  if(k==='enter'||k===' '){
    if(G.ph==='lobby'&&tg&&tg.closest('button'))return;   /* in der Lobby bedient die Tastatur den fokussierten Knopf */
    const b=$('#go')||$('#cont')||$('#showEnd');if(b){e.preventDefault();b.click()}   /* am Endstand führt die Leertaste zur Rundenwahl, nie zu "alles auf 0" */
  }
});

/* ========== SPIELER ========== */
let myBet=null,me=ls.get('kp-name')||'',showCode='',joined=false,host=null,myR=null,myA=null,pPeer=null,pConn=null,pState='',retryT=null;
/* Gerätekennung für den Host: so erkennt er dasselbe Handy nach einem Neuladen wieder. Ohne localStorage bleibt sie leer */
const myCid=(()=>{let c=ls.get('kp-cid');if(!c){c=Math.random().toString(36).slice(2,12);ls.set('kp-cid',c);if(ls.get('kp-cid')!==c)c=''}return c})();
const hiMsg=()=>myCid?{t:'hi',name:me,cid:myCid}:{t:'hi',name:me};
function startPlayer(c){mode='player';showCode=c;$('#pick').hidden=true;$('#ph').classList.add('on');pRender()}
function pConnect(){
  clearTimeout(retryT);
  if(!hasPeer){pState='Die Verbindungsbibliothek konnte nicht geladen werden. Seite neu laden.';return pRender()}
  if(!pPeer||pPeer.destroyed){
    pPeer=new Peer({debug:0});
    pPeer.on('open',()=>dial());
    pPeer.on('disconnected',()=>{setTimeout(()=>{try{pPeer.reconnect()}catch(e){}},1000)});
    pPeer.on('error',e=>{if(e.type==='peer-unavailable'){pState='Show '+showCode+' nicht gefunden. Läuft der große Bildschirm? Ich versuche es weiter.';pRender();retryT=setTimeout(dial,2500)}else{pState='Verbindung hakt, ich versuche es weiter.';pRender();retryT=setTimeout(dial,3000)}});
  }else dial();
}
function dial(){
  clearTimeout(retryT);if(!pPeer||!pPeer.open){retryT=setTimeout(dial,1500);return}
  try{pConn&&pConn.close()}catch(e){}
  pState='Verbinde mit Show '+showCode+' …';pRender();
  const c=pPeer.connect(PFX+showCode,{reliable:true});pConn=c;
  c.on('open',()=>{if(pConn!==c)return;pState='';c.send(hiMsg());if(host&&myA!=null)c.send({t:'ans',r:host.r,a:myA});pRender()});
  c.on('data',d=>{if(pConn!==c||!d||d.role!=='host')return;host=d;if(typeof d.you==='string'&&d.you&&d.you!==me)me=d.you.slice(0,20);if(host.r!==myR){myR=host.r;myA=null;myBet=null}pRender()});
  c.on('close',()=>{if(pConn!==c)return;pState='Verbindung verloren, verbinde neu …';pRender();retryT=setTimeout(dial,1500)});
}
/* Handy war gesperrt oder im Hintergrund: beim Zurückkommen sofort prüfen, ob die Leitung noch steht */
document.addEventListener('visibilitychange',()=>{if(mode==='player'&&joined&&document.visibilityState==='visible'&&(!pConn||!pConn.open)){try{if(pPeer&&pPeer.disconnected&&!pPeer.destroyed)pPeer.reconnect()}catch(e){}pConnect()}});
function myScore(){if(!host||!Array.isArray(host.sc))return null;const i=host.sc.findIndex(x=>key(x[0])===key(me));return i<0?null:{rank:i+1,s:host.sc[i][1],d:host.sc[i][2],of:host.sc.length}}
function pAnswer(i){if(!host||host.ph!=='q'||myA!=null)return;myA=i;try{navigator.vibrate&&navigator.vibrate(40)}catch(e){}try{pConn&&pConn.open&&pConn.send({t:'ans',r:host.r,a:i})}catch(e){}pRender()}
function pRender(){
  const b=$('#pBody'),m=myScore();$('#pMe').textContent=joined?(me+(m?' · '+eur(m.s):'')):'';
  const vk0=b.dataset.vk||'';b.dataset.vk='';
  if(!joined){
    b.innerHTML=`<div class="state">Wie heißt du?</div><p class="muted">Dein Name erscheint auf dem großen Bildschirm.</p>
      <form id="jf"><input id="nm" maxlength="20" autocomplete="off" value="${esc(me)}" placeholder="Vorname" aria-label="Name">
      ${showCode?`<p class="muted">Show-Code: <b class="mini">${esc(showCode)}</b></p>`:'<input id="cd" maxlength="6" autocomplete="off" placeholder="Show-Code vom Fernseher" aria-label="Show-Code" style="margin-top:12px;text-transform:uppercase">'}
      <button class="btn" style="margin-top:14px;width:100%">Rein in die Show</button></form>`;
    $('#jf').onsubmit=e=>{e.preventDefault();const v=$('#nm').value.replace(/\s+/g,' ').trim();const cd=$('#cd');if(cd)showCode=cd.value.toUpperCase().replace(/[^A-Z0-9]/g,'');if(!v||!showCode)return;me=v.slice(0,20);ls.set('kp-name',me);joined=true;keepAwake();try{history.replaceState(null,'','#'+showCode)}catch(x){}pConnect();pRender()};return;
  }
  if(pState&&!host){b.innerHTML=`<div class="state">Moment …</div><p class="muted">${esc(pState)}</p>`;return}
  if(!host){b.innerHTML=`<div class="state">Du bist drin, ${esc(me)}.</div><p class="muted">Warte auf den großen Bildschirm.</p>`;return}
  const warn=pState?`<p class="warn">${esc(pState)}</p>`:'';
  const ph=host.ph,a=Array.isArray(host.a)?host.a:[];
  const out=!m&&Array.isArray(host.sc)&&host.sc.length?'<p class="muted">Du bist gerade nicht in der Wertung. Antworte bei der nächsten Frage, dann bist du wieder dabei.</p>':'';
  if(ph==='lobby'){b.innerHTML=`<div class="state">Du bist drin, ${esc(me)}.</div><p class="muted">Gleich geht's los. Schnell und richtig bringt am meisten.</p>${warn}`;return}
  if(ph==='end'){b.innerHTML=`<div class="state">${m?`Platz ${m.rank} von ${m.of}`:'Show vorbei'}</div><p class="ptimer">${m?eur(m.s):''}</p><p class="muted">Danke fürs Mitspielen. Bleib dran, vielleicht kommt noch eine Runde.</p>${warn}`;return}
  if(ph==='fin'){b.innerHTML=`<div class="state">Finale!</div><p class="ptimer">Gleich setzt du</p><p>Du entscheidest selbst, wie viel du riskierst. Richtig gewinnt den Einsatz dazu, falsch verliert ihn.</p>${warn}`;return}
  if(ph==='bet'){
    const sc=m?m.s:0,mx=sc>0?sc:1000;
    if(myBet!=null){b.innerHTML=`<div class="state">Einsatz gesetzt: ${eur(myBet)}</div><p class="muted">Kein Zurück. Gleich kommt die Finalfrage.</p>${warn}`;return}
    const vk='bet:'+host.r;
    if(vk0===vk){b.dataset.vk=vk;const t=b.querySelector('.ptimer');if(t)t.textContent=host.left|0;const w=b.querySelector('.pw');if(w)w.innerHTML=warn;return}
    const opts=sc>0?[[0,'Nichts'],[Math.round(mx*.25/100)*100,'25 %'],[Math.round(mx*.5/100)*100,'Die Hälfte'],[Math.round(mx*.75/100)*100,'75 %'],[mx,'ALLES!']]:[[0,'Nichts'],[500,'500 €'],[1000,'1.000 €']];
    b.dataset.vk=vk;
    b.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><span class="muted">Finale · Dein Konto: ${eur(sc)}</span><span class="ptimer">${host.left|0}</span></div><div class="state">Wie viel setzt du?</div>
      <div class="buzz">${opts.map(([v,l],i)=>`<button class="bz" data-v="${v}" style="background:${ACOL[i%4]}"><span class="l">${esc(l)}</span><span>${eur(v)}</span></button>`).join('')}</div><div class="pw">${warn}</div>`;
    b.querySelectorAll('.bz').forEach(x=>x.onclick=()=>{if(myBet!=null||!host||host.ph!=='bet')return;myBet=+x.dataset.v;try{navigator.vibrate&&navigator.vibrate(60)}catch(e){}try{pConn&&pConn.open&&pConn.send({t:'bet',r:host.r,v:myBet})}catch(e){}pRender()});return;
  }
  if(ph==='intro'){b.innerHTML=`<div class="state">Dis oder Dat!</div><p class="muted">Sechs Sekunden pro Name. Schau auf den Fernseher.</p>${warn}`;return}
  if(ph==='read'){b.innerHTML=`<p class="muted">${esc(host.lab)}</p><div class="state" style="font-size:24px">${esc(host.t)}</div><p class="muted">Hör zu, gleich darfst du drücken.</p>${warn}`;return}
  if(ph==='q'){
    if(myA!=null){b.innerHTML=`<p class="muted">${esc(host.lab)}</p><div class="state">Antwort ist eingeloggt.</div><div class="lock" style="--c:${ACOL[myA]||ACOL[0]}">${host.k==='dd'?'':`<b>${LET[myA]||''}</b>`}<span>${esc(a[myA])}</span></div><p class="muted">Kein Zurück. Wie im echten Projekt.</p>${warn}`;return}
    /* Solange dieselbe Frage läuft, nur die Sekunden tauschen: ein Neuaufbau mitten im Tippen würde den Tipp verschlucken */
    const vk='q:'+host.r+':'+a.length;
    if(vk0===vk){b.dataset.vk=vk;const t=b.querySelector('.ptimer');if(t)t.textContent=host.left|0;const w=b.querySelector('.pw');if(w)w.innerHTML=warn;return}
    b.dataset.vk=vk;
    b.innerHTML=`<div style="display:flex;justify-content:space-between;align-items:center"><span class="muted">${esc(host.lab)}</span><span class="ptimer">${host.left|0}</span></div>
      ${host.k==='dd'?`<div class="state" style="text-align:center">${esc(host.t)}</div>`:''}
      <div class="buzz">${a.map((t,i)=>`<button class="bz ${host.k==='dd'?'dd2':''}" data-i="${i}" style="background:${ACOL[i]}">${host.k==='dd'?'':`<span class="l">${LET[i]}</span>`}<span>${esc(t)}</span></button>`).join('')}</div><div class="pw">${warn}</div>`;
    b.querySelectorAll('.bz').forEach(x=>x.onclick=()=>pAnswer(+x.dataset.i));return;
  }
  if(ph==='board'||ph==='wait'){
    const sc=Array.isArray(host.sc)?host.sc:[];const ahead=m&&m.rank>1?sc[m.rank-2]:null;
    b.innerHTML=`<p class="muted">Zwischenstand</p><div class="state">${m?`Platz ${m.rank} von ${m.of}`:'Zwischenstand'}</div><p class="ptimer">${m?eur(m.s):'0 €'}</p>
      ${m&&m.rank===1?'<p>Du führst. Jetzt bloß nicht nachlassen.</p>':ahead?`<p>Noch <b>${eur(ahead[1]-m.s)}</b> bis Platz ${m.rank-1} (${esc(ahead[0])}).</p>`:''}${out}${warn}`;return;
  }
  if(ph==='rev'){
    if(host.c==null){b.innerHTML=`<div class="state">Zwischenstand</div><p class="ptimer">${m?eur(m.s):''}</p><p class="muted">${m?`Platz ${m.rank} von ${m.of}`:''}</p>${warn}`;return}
    const d=m?m.d:null;
    b.innerHTML=`<div class="state">${d==null?'Keine Antwort':d>0?'Richtig!':'Leider falsch'}</div>
      <p class="ptimer" style="color:${d==null?'var(--soft)':d>0?'var(--a1)':'var(--bad)'}">${d==null?'0 €':(d>0?'+':'')+eur(d)}</p>
      <p class="muted">Richtig war ${host.k==='dd'?'':LET[host.c]+': '}${esc(a[host.c])}</p><p>Kontostand: <b>${m?eur(m.s):'0 €'}</b>${m?` · Platz ${m.rank} von ${m.of}`:''}</p>${out}${warn}`;
  }
}
if(hashCode)startPlayer(hashCode);
}
</script>
</body>
